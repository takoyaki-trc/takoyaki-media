.offer.active{outline:3px solid #d49c45;background:#fff1c2}.room b{font-size:20px}.room small{display:block;font-size:11px}.sectionTitle{font-size:13px;font-weight:900;margin:12px 0 6px}.hud{display:grid;grid-template-columns:1fr 1.4fr;gap:5px;margin-top:12px}.hud>div{background:#343f47;color:#fae9c4;border:2px solid #29343b;border-radius:4px;padding:7px 9px;font-size:10px;font-weight:800;letter-spacing:.08em}.hud strong{display:block;font-size:22px;letter-spacing:0;color:#ffe097;font-variant-numeric:tabular-nums}.weeks{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:7px}.week{padding:5px 3px;border:1px solid #b49c75;background:#fff8e5;border-radius:4px;text-align:center;font-size:10px;line-height:1.4}.week strong{display:block;font-size:15px}.week.now{border:2px solid #ba8540;background:#ffe3a0}.week.payweek{color:#39734e}.week.rentweek{color:#a24e39}.sponsor{display:flex;gap:10px;align-items:center}.logoTile{width:54px;height:54px;flex:none;display:grid;place-items:center;border:2px solid #c3a76f;background:#e2c477;color:#34444b;font-size:23px;font-weight:1000;border-radius:5px;letter-spacing:-.05em}.sponsorInfo{flex:1;min-width:0}.sponsorInfo b{display:block;font-size:17px;line-height:1.4}.sponsorInfo small{font-size:11px}.cash{font-size:21px;font-weight:900;color:#8a5222}.dark .cash{color:#ffe193}.progress{height:7px;background:#d9c9ac;border-radius:3px;overflow:hidden}.progress i{display:block;height:100%;background:#6e9a70}.statRow{display:grid;grid-template-columns:69px 1fr 33px;gap:7px;align-items:center;font-size:12px;font-weight:750;margin:6px 0}.statRow strong{text-align:right;font-variant-numeric:tabular-nums}.offer{display:block;width:100%;text-align:left;color:#3b3023;background:#fff9e9;border:2px solid #b3986c;border-radius:6px;padding:10px;margin-top:8px}.offer .logoTile{width:43px;height:43px;font-size:18px}.offer h3{font-size:15px}.offer .cash{font-size:19px}.offer p{font-size:11px;margin-top:7px;color:#705f48}.offer .condition{background:#f1e5c9;padding:5px 7px;border-radius:3px;font-size:11px;margin-top:5px}.offer.locked{background:#eee5d2;opacity:.68;cursor:not-allowed}.offer.active{border-color:#b47d35}.tag{font-size:10px;padding:2px 5px;background:#e4d4b1;border-radius:3px;font-weight:800}.tag.ok{background:#d5e6c8;color:#336346}.tag.bad{background:#efd1c4;color:#9d4837}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.choices .btn{margin:0;font-size:12px;min-height:45px;background:#fff8e4;border-color:#a99067}.choices .selected{background:#f7d384;border-color:#ac7b30}.eventCard{text-align:center;padding:17px 10px;background:#fff9e7;border:2px solid #b49768;border-radius:6px;margin:10px 0}.eventCard .big{font-size:36px;font-weight:950;color:#a26529;margin:7px 0}.eventCard .big.good{color:#428050}.eventCard .big.bad{color:#ac503b}.eventCard .sub{margin:7px 0}.log{font-size:11px;line-height:1.5;max-height:180px;overflow:auto}.log div{border-top:1px solid #d7c4a0;padding:6px 0}.log div:first-child{border-top:0}.notice{font-size:11px;color:#80694d;text-align:center;margin:11px 0 0}.summaryGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:9px}.summaryGrid>div{border:1px solid #c7ad83;background:#fff5dc;border-radius:5px;padding:8px;font-size:11px}.summaryGrid b{display:block;font-size:17px}.raceOpts .btn{margin-top:8px;text-align:left}.raceOpts small{display:block;font-weight:500;margin-top:3px}.rank{font-size:49px;line-height:1.15;font-weight:950;color:#f8d483;text-shadow:2px 2px #98713c}.hidden{display:none!important}@media(max-width:350px){main{padding:8px}.panel{padding:10px}.hud strong{font-size:19px}.logoTile{width:43px;height:43px}.sponsorInfo b{font-size:15px}}
</style></head><body><main><header><div class="logo">契</div><div><small>TAKOMIN JET RUSH</small><b>スポンサー制度</b></div><span>TEST 1.0</span></header><div id="app"></div><p class="notice">独立したシミュレーターです。実際の育成・OCTOには反映されません。</p></main><script>
"use strict";
const $=id=>document.getElementById(id),fmt=n=>Number(n).toLocaleString("ja-JP"),keys=["speed","power","tech","stamina","guts"],names=["スピード","パワー","技術","持久力","根性"],rents={N:4000,R:8000,UR:16000,LR:40000},roomRates={N:1,R:1.2,UR:1.5,LR:3},targets=[65000,75000,85000,95000,105000,120000],stages=["地区大会","第2大会","第3大会","第4大会","第5大会","最終大会"];
const sponsors=[
{id:"local",brand:"NANA",name:"地元のたこ焼き屋",pay:2000,bonus:1000,focus:"guts",gain:60,wins:0,min:0,color:"#d1a567",desc:"まずは地元から応援。"},
{id:"street",brand:"街",name:"タコ民商店街",pay:3500,bonus:1500,focus:"stamina",gain:100,wins:0,min:0,color:"#b6cb9b",desc:"持久力を重視する商店街。"},
{id:"cards",brand:"TC",name:"たこ焼きトレカショップ",pay:5000,bonus:2500,focus:"tech",gain:120,wins:1,min:120,color:"#b6afd0",desc:"丁寧な技術を評価。"},
{id:"food",brand:"TAKO",name:"たこ焼き食品メーカー",pay:7500,bonus:4000,focus:"power",gain:150,wins:2,min:200,color:"#dfb19c",desc:"パワフルな選手を探しています。"},
{id:"jet",brand:"JET",name:"大手JET開発企業",pay:10000,bonus:6000,focus:"speed",gain:180,wins:3,min:300,color:"#a9cbd4",desc:"世界を狙うスピードを評価。"}
];
let selectedRoom="R",initialMoney=200000,s,selectedOffer=null,focus="speed",pending=false;
const fresh=(room,money)=>({week:1,room,money,initial:money,stats:{speed:40,power:40,tech:40,stamina:40,guts:40},wins:0,contract:null,support:0,bonuses:0,rentPaid:0,raceRewards:0,log:[],ended:false,reason:"",cycles:0,lastPay:0});
function addLog(text){s.log.unshift("WEEK "+s.week+"　"+text)}
function shell(body){$("app").innerHTML=body;window.scrollTo(0,0)}
function bind(id,fn){const e=$(id);if(e)e.onclick=fn}
function buttons(selector,fn){document.querySelectorAll(selector).forEach(e=>e.onclick=()=>fn(e.dataset))}
function logo(sp){return '<div class="logoTile" style="background:'+sp.color+'">'+sp.brand+'</div>'}
function head(){return '<div class="hud"><div>WEEK<strong>'+Math.min(s.week,72)+' / 72</strong></div><div>所持 OCTO<strong>'+fmt(s.money)+'</strong></div></div>'}
function log(){return '<div class="panel"><div class="row"><h3>活動記録</h3><span class="sub">最新順</span></div><div class="log">'+(s.log.length?s.log.slice(0,12).map(t=>'<div>'+t+'</div>').join(""):"まだ記録はありません。")+'</div></div>'}
function setup(){shell('<div class="panel hero"><div class="eyebrow">SPONSOR CAREER SIMULATOR</div><h1>仕事をなくしたら、<br>育成はどう変わる？</h1><p class="sub">スポンサーと契約して72週間を育成。4週間単位の短縮テストです。ミニゲームはなく、大会結果は選んで試せます。</p></div><div class="panel"><h3>① 部屋ランクを選ぶ</h3><p class="sub">本編と同じ4週間分の家賃です。</p><div class="grid2" style="margin-top:8px">'+Object.keys(rents).map(k=>'<button class="room '+(selectedRoom===k?'active':'')+'" data-room="'+k+'"><b>'+k+'</b><small>家賃 '+fmt(rents[k])+' OCTO</small><small>成長 ×'+roomRates[k].toFixed(2)+'</small></button>').join("")+'</div><div class="sectionTitle">② 初期の所持OCTO</div><select id="money" style="width:100%;padding:10px;border:2px solid #b3986c;border-radius:5px;background:#fff9e6"><option value="200000">200,000（本編テスト残高）</option><option value="50000">50,000（厳しめ）</option><option value="20000">20,000（低予算）</option></select><button class="btn" id="begin">育成スタート ▶</button></div>');
$("money").value=String(initialMoney);$("money").onchange=e=>initialMoney=Number(e.target.value);buttons("[data-room]",d=>{selectedRoom=d.room;setup()});bind("begin",()=>{s=fresh(selectedRoom,initialMoney);focus="speed";offerScreen()})}
function eligible(sp,st=s){return st.wins>=sp.wins&&st.stats[sp.focus]>=sp.min}
function objective(sp){return names[keys.indexOf(sp.focus)]+"を契約期間中に +"+sp.gain}
function offerScreen(){selectedOffer=null;const available=sponsors.filter(x=>eligible(x));const list=sponsors.map(sp=>{const ok=eligible(sp);return '<button class="offer '+(ok?"":"locked")+'" data-offer="'+sp.id+'" '+(ok?"":"disabled")+'><div class="sponsor">'+logo(sp)+'<div class="sponsorInfo"><h3>'+sp.name+'</h3><span class="cash">'+fmt(sp.pay)+' OCTO</span><small> / 4週</small></div><span class="tag '+(ok?"ok":"")+'">'+(ok?"契約可":"未解放")+'</span></div><p>'+sp.desc+'</p><div class="condition">'+(ok?"達成ボーナス "+fmt(sp.bonus)+" OCTO ｜ "+objective(sp):"解放：大会突破 "+sp.wins+"回 ＋ "+names[keys.indexOf(sp.focus)]+" "+sp.min+"以上")+'</div></button>'}).join("");shell(head()+'<div class="panel dark"><div class="eyebrow">NEW SPONSOR OFFER</div><h2>スポンサーからオファー！</h2><p class="sub">契約は次の大会までの12週間。支援金は4週ごとに受け取れます。ノルマ未達でも支援金の返還はありません。</p></div><div class="panel"><div class="row"><h3>契約先を選択</h3><span class="tag ok">'+available.length+'社から選べる</span></div>'+list+'<button id="sign" class="btn" disabled>契約先を選んでください</button><button id="skip" class="btn secondary">契約せずに進む</button></div>');buttons("[data-offer]",d=>{selectedOffer=sponsors.find(x=>x.id===d.offer);if(!eligible(selectedOffer))return;document.querySelectorAll(".offer").forEach(e=>e.classList.toggle("active",e.dataset.offer===d.offer));$("sign").disabled=false;$("sign").textContent=selectedOffer.name+" と契約する ▶"});bind("sign",()=>{if(!selectedOffer||!eligible(selectedOffer))return;s.contract={id:selectedOffer.id,start:s.week,baseline:s.stats[selectedOffer.focus],end:Math.ceil(s.week/12)*12};addLog(selectedOffer.name+" と契約");contractScreen(selectedOffer)});bind("skip",()=>{s.contract=null;addLog("スポンサー契約なし");dashboard()})}
function contractScreen(sp){shell(head()+'<div class="panel dark" style="text-align:center"><div class="eyebrow">CONTRACT SIGNED</div><div style="display:flex;justify-content:center;margin:12px">'+logo(sp)+'</div><h1>スポンサー契約成立!!</h1><p>'+sp.name+'</p><div class="rank">'+fmt(sp.pay)+'</div><p>OCTO / 4週間</p><p class="sub" style="margin-top:8px">契約期間 WEEK '+s.contract.start+'〜'+s.contract.end+'</p></div><div class="panel"><h3>契約ミッション</h3><p style="margin-top:6px">'+objective(sp)+'</p><p class="cash">達成で +'+fmt(sp.bonus)+' OCTO</p><p class="sub">未達でもペナルティなし。契約更新時に判定します。</p><button class="btn" id="ok">育成に戻る ▶</button></div>');bind("ok",dashboard)}
function statBars(){return keys.map((k,i)=>'<div class="statRow"><span>'+names[i]+'</span><div class="progress"><i style="width:'+s.stats[k]/999*100+'%"></i></div><strong>'+s.stats[k]+'</strong></div>').join("")}
function contractHTML(){if(!s.contract)return '<div class="panel"><h3>スポンサーなし</h3><p class="sub">次の大会終了後に新しい契約を検討できます。</p></div>';const sp=sponsors.find(x=>x.id===s.contract.id),gain=s.stats[sp.focus]-s.contract.baseline;return '<div class="panel dark"><div class="eyebrow">CURRENT SPONSOR</div><div class="sponsor" style="margin:8px 0">'+logo(sp)+'<div class="sponsorInfo"><b>'+sp.name+'</b><span class="cash">'+fmt(sp.pay)+' OCTO</span><small> / 4週</small></div></div><p class="sub">契約期限 WEEK '+s.contract.end+' ｜ ミッション '+gain+' / '+sp.gain+'</p><div class="progress"><i style="width:'+Math.min(100,gain/sp.gain*100)+'%"></i></div><p class="sub">達成ボーナス '+fmt(sp.bonus)+' OCTO</p></div>'}
function dashboard(){pending=false;const w=s.week,end=w+3;const sp=s.contract&&sponsors.find(x=>x.id===s.contract.id);const net=(sp?.pay||0)-rents[s.room];shell(head()+'<div class="weeks">'+[w,w+1,w+2,w+3].map(n=>'<div class="week '+(n===w?"now":"")+(n%4===2?" payweek":"")+(n%4===0?" rentweek":"")+'"><strong>'+n+'</strong>'+(n%4===2?"支援金":n%12===0?"家賃・大会":n%4===0?"家賃":"育成")+'</div>').join("")+'</div>'+contractHTML()+'<div class="panel"><div class="row"><h3>育成ステータス</h3><span class="tag">'+s.room+' 部屋</span></div>'+statBars()+'<div class="sectionTitle">4週間の重点トレーニング</div><div class="choices">'+keys.map((k,i)=>'<button class="btn '+(k===focus?"selected":"")+'" data-focus="'+k+'">'+names[i]+'</button>').join("")+'</div><p class="sub" style="margin-top:8px">簡易育成：重点能力 +'+Math.round(42*roomRates[s.room])+'、副能力 +'+Math.round(16*roomRates[s.room])+'（上限999）。本編の詳細な体力・イベント計算は省略しています。</p></div><div class="panel"><div class="row"><h3>今期の資金予定</h3><span class="tag '+(net>=0?"ok":"bad")+'">'+(net>=0?"+":"−")+fmt(Math.abs(net))+'</span></div><p class="sub">WEEK '+(w+1)+' 支援金 +'+fmt(sp?.pay||0)+'<br>WEEK '+end+' 家賃 −'+fmt(rents[s.room])+'</p><button id="advance" class="btn">4週間を進める ▶</button><button id="restart" class="btn secondary">最初からテストする</button></div>'+log());buttons("[data-focus]",d=>{focus=d.focus;dashboard()});bind("advance",advance);bind("restart",setup)}
function advance(){if(pending||s.ended)return;pending=true;const w=s.week;s.week=w+1;const sp=s.contract&&sponsors.find(x=>x.id===s.contract.id);const pay=sp?.pay||0;s.money+=pay;s.support+=pay;s.lastPay=pay;addLog("スポンサー支援金 +"+fmt(pay));shell(head()+'<div class="panel dark" style="text-align:center"><div class="eyebrow">SUPPORT PAYMENT</div><h2>活動支援金が届きました！</h2><div class="rank" style="margin:10px 0">+'+fmt(pay)+'</div><p>OCTO</p><p class="sub">'+(sp?sp.name:"未契約")+' ｜ 体力消費なし</p></div><div class="panel"><p class="sub">この支援金は家賃や食事、育成の資金に使えます。</p><button class="btn" id="continue">育成を続ける ▶</button></div>');bind("continue",()=>{s.week=w+3;const sub=keys[(keys.indexOf(focus)+1)%keys.length],before=s.stats[focus];s.stats[focus]=Math.min(999,s.stats[focus]+Math.round(42*roomRates[s.room]));s.stats[sub]=Math.min(999,s.stats[sub]+Math.round(16*roomRates[s.room]));s.cycles++;addLog(names[keys.indexOf(focus)]+" +"+(s.stats[focus]-before));rentScreen()})}
function rentScreen(){const rent=rents[s.room],ok=s.money>=rent;shell(head()+'<div class="panel eventCard"><div class="eyebrow">ROOM RENT / WEEK '+s.week+'</div><h2>お部屋の家賃支払い</h2><div class="big bad">−'+fmt(rent)+'</div><p>'+s.room+'ランクのお部屋</p><p class="sub">支払い後 '+fmt(Math.max(0,s.money-rent))+' OCTO</p><span class="tag '+(ok?"ok":"bad")+'">'+(ok?"支払い可能":"残高不足")+'</span><button id="rent" class="btn">'+(ok?"家賃を支払う ▶":"退去・育成終了")+'</button></div>');bind("rent",()=>{if(!ok){end("家賃未払いで育成終了");return}s.money-=rent;s.rentPaid+=rent;addLog("家賃 −"+fmt(rent));if(s.week%12===0)raceScreen();else{s.week++;dashboard()}})}
function raceScreen(){const i=s.week/12-1,target=targets[i];shell(head()+'<div class="panel dark" style="text-align:center"><div class="eyebrow">JET RUSH / STAGE '+(i+1)+'</div><h1>'+stages[i]+'</h1><div class="rank">'+fmt(target)+'</div><p>目標スコア</p><p class="sub">スポンサー制度の確認用に結果を選択します。</p></div><div class="panel raceOpts"><h3>大会成績を選ぶ</h3><button class="btn" data-race="S">🏆 S評価・好成績で突破<small>目標の2倍のスコア</small></button><button class="btn" data-race="B">✅ B評価・規定スコアで突破<small>目標スコアを達成</small></button><button class="btn secondary" data-race="D">敗退・目標未達<small>本編同様、育成終了</small></button></div>');buttons("[data-race]",d=>raceResult(d.race,target))}
function raceResult(rank,target){const pass=rank!=="D",score=rank==="S"?target*2:rank==="B"?target:Math.floor(target*.8),reward=Math.min(7500,Math.floor(score/12)+(pass?700+600+(rank==="S"?1800:400):0));s.money+=reward;s.raceRewards+=reward;if(pass)s.wins++;addLog("大会 "+rank+"評価 ／ +"+fmt(reward)+" OCTO");const sp=s.contract&&sponsors.find(x=>x.id===s.contract.id);const gain=sp?s.stats[sp.focus]-s.contract.baseline:0,bonus=pass&&sp&&gain>=sp.gain?sp.bonus:0;s.money+=bonus;s.bonuses+=bonus;if(sp)addLog("契約ミッション "+(bonus?"達成 +"+fmt(bonus):"未達・返還なし"));s.contract=null;const unlocked=sponsors.filter(x=>eligible(x)&&x.wins===s.wins&&pass&&x.wins>0);shell(head()+'<div class="panel dark" style="text-align:center"><div class="eyebrow">RACE RESULT</div><div class="rank">'+rank+'</div><h2>'+(pass?"大会突破！":"大会敗退")+'</h2><p>'+fmt(score)+' PTS</p><p class="cash">賞金 +'+fmt(reward)+' OCTO</p></div><div class="panel"><h3>契約期間終了</h3><p style="margin-top:6px">'+(sp?sp.name+" ｜ "+gain+" / "+sp.gain:"契約なし")+'</p><div class="eventCard"><h3>'+(bonus?"ミッション達成！":sp?"ミッション未達":"契約なし")+'</h3><div class="big '+(bonus?"good":"")+'">+'+fmt(bonus)+'</div><p class="sub">'+(bonus?"追加報酬を獲得！":"ペナルティ・支援金の返還なし")+'</p></div>'+(unlocked.length?'<p class="tag ok">新スポンサー候補：'+unlocked.map(x=>x.name).join("、")+'</p>':"")+'<button id="next" class="btn">'+(!pass||s.week===72?"最終結果へ":"次のスポンサーオファーへ ▶")+'</button></div>');bind("next",()=>{if(!pass||s.week===72){end(pass?"72週間の育成完了！":"大会敗退で育成終了");return}s.week++;offerScreen()})}
function end(reason){s.ended=true;s.reason=reason;shell(head()+'<div class="panel dark" style="text-align:center"><div class="eyebrow">CAREER RESULT</div><h1>'+reason+'</h1><div class="rank">'+fmt(s.money)+'</div><p>最終所持 OCTO</p></div><div class="panel"><h3>72週間の資金収支（進行済み分）</h3><div class="summaryGrid">'+[["初期残高",s.initial],["スポンサー支援金",s.support],["契約達成ボーナス",s.bonuses],["大会賞金",s.raceRewards],["家賃支出",-s.rentPaid],["大会突破",s.wins+" / 6"]].map(([k,v])=>'<div>'+k+'<b>'+(typeof v==="number"?fmt(v):v)+'</b></div>').join("")+'</div><p class="sub" style="margin-top:8px">食事・ガチャ費用・トレカ売上などはこのテストに含まれません。</p></div><div class="panel"><h3>最終能力</h3>'+statBars()+'<button class="btn" id="again">別の部屋・スポンサーで試す</button></div>'+log());bind("again",setup)}
setup();
</script></body></html>
