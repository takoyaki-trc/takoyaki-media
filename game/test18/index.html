 const isChar=kind==='character',prices=isChar?CHARACTER_PRICES:ROOM_PRICES;
 const title=isChar?'STEP 1　タコ民ガチャ':'STEP 2　お部屋ガチャ';
 const opts=prices.map((n,i)=>'<option value="'+i+'">'+n.toLocaleString()+' OCTO</option>').join('');
 const pic=isChar?portrait():ROOMS[0].url;
 open('🎰 '+title,'<p class="notice">所持 '+state.octo.toLocaleString()+' OCTO（サンプル残高）</p><label>ガチャ料金</label><select id="gachaPrice" class="gachaSelect">'+opts+'</select><div class="rouletteWindow" id="rouletteWindow"><img src="'+pic+'" alt="ルーレット"><strong>🎰 ガチャを回そう！</strong></div><button class="option gachaGo" id="gachaGo">🎰 ルーレットを回す！</button><p class="radarNote">高額ほど高レアが出やすくなります。確率はサンプル用です。</p>');
 $('closePanel').style.display='none';
 $('gachaGo').onclick=()=>{
 const idx=Number($('gachaPrice').value),cost=prices[idx];
 if(isChar && state.octo-cost<ROOM_PRICES[0]){alert('お部屋ガチャ用に最低500 OCTOを残してください。');return}
 if(state.octo<cost){alert('OCTOが足りません');return}
 $('gachaGo').disabled=true;$('gachaPrice').disabled=true;
 const pool=isChar?CHARACTERS:ROOMS;
 const stage=$('rouletteWindow');stage.classList.add('spinning');
 let tick=0;
 const interval=setInterval(()=>{const obj=pool[tick++%pool.length];stage.querySelector('img').src=isChar?obj.url:obj.url;stage.querySelector('strong').textContent=obj.name},90);
 setTimeout(()=>{
 clearInterval(interval);stage.classList.remove('spinning');
 const rank=chooseRank(idx);
 const candidates=pool.filter(x=>x.rarity===rank);
 const picked=candidates[Math.floor(Math.random()*candidates.length)]||pool[Math.floor(Math.random()*pool.length)];
 state.octo-=cost;
 stage.querySelector('img').src=picked.url;stage.querySelector('strong').textContent=picked.name+'　【'+picked.rarity+'】';
 if(isChar){
  state.characterId=picked.id;state.characterName=picked.name;state.rarity=picked.rarity;state.growth=picked.growth;state.personality=picked.personality;state.characterCost=cost;state.setup='room';
  const base=RARITY_RULES[picked.rarity].base;
  for(const k of Object.keys(state.stats))state.stats[k]=base;
  const fav=PERSONALITIES[picked.personality].fav;if(fav)state.stats[fav]+=8;
 }else{state.roomId=picked.id;state.roomCost=cost;state.setup='ready'}
 save();render();
 const desc=isChar?'成長：'+GROWTH_NAMES[picked.growth]+'／性格：'+PERSONALITIES[picked.personality].name:'育成効果 ×'+picked.bonus.toFixed(2);
 const next=isChar?'🏠 次はお部屋ガチャへ':'🎮 48週間の育成を始める！';
 const btn=document.createElement('button');btn.className='option gachaGo';btn.textContent=next;
 btn.onclick=()=>{close();if(isChar)roulette('room');else{render();msg('育成スタート！')}};
 $('gachaGo').replaceWith(btn);
 const d=document.createElement('p');d.className='notice';d.textContent=desc;stage.after(d);
 },1700);
 };
}

function rollAwakening(){if(state.awakeLeft>0||state.awakeCount>=2||state.day<4||state.day>45)return false;const chance=state.awakeCount===0?.09:.045;if(Math.random()>=chance)return false;const rule=RARITY_RULES[state.rarity];state.awakeLeft=rule.duration[0]+Math.floor(Math.random()*(rule.duration[1]-rule.duration[0]+1));state.awakeCount++;state.awakeToday=true;state.awakeSeen=false;return true}

function renderCharacterSpeech(){
 const hp=Math.max(0,Number(state.hp)||0),tier=hp===0?2:hp<=30?2:hp<=60?1:0;
 const personality=VOICE_LINES[state.personality]||VOICE_LINES.steady;
 const list=personality[tier];const index=Math.floor((state.day-1)/2)%list.length;
 let line=list[index];const age=state.ageGroup||'adult',gender=state.gender||'unspecified';
 if(age==='child'){line=tier===2?'もうへとへとだよ〜！ おやすみしたい！':tier===1?'ちょっとつかれちゃった。おやつ休憩したいな！':'やったー！ きょうもがんばるぞ！';}

function themeDrawingScore(topic){
 // 実際の横長キャンバス全体を縮小して解析。旧版の280x380読み取りは一部しか見ていなかった。
 const mini=document.createElement('canvas');mini.width=160;mini.height=114;
 const m=mini.getContext('2d',{willReadFrequently:true});m.drawImage(drawCanvas,0,0,160,114);
 const data=m.getImageData(0,0,160,114).data;
 let ink=0,matching=0,center=0,top=0,bottom=0,edges=0,bright=0;
 const cells=new Set(),paletteHits=new Set();
 for(let y=0;y<114;y++)for(let x=0;x<160;x++){
  const i=(y*160+x)*4,r=data[i],g=data[i+1],b=data[i+2];
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b),sat=mx-mn;
  if(mn>235&&sat<18)continue;
  ink++;cells.add(Math.floor(x/20)+','+Math.floor(y/19));
  if(x>35&&x<125&&y>20&&y<95)center++;
  if(y<38)top++;if(y>76)bottom++;
  if(x<10||x>149||y<8||y>105)edges++;
  if(sat>65){bright++;paletteHits.add(r>g&&r>b?'r':g>r&&g>b?'g':'b')}
  const match={warm:r>g*1.14&&r>b*1.2,blue:b>r*1.18&&b>g*1.05,green:g>r*1.15&&g>b*1.06,night:mx<110||(r>125&&g>105&&b<Math.min(r,g)*.75),red:r>g*1.45&&r>b*1.4,winter:b>r||b>125&&g>125&&r<210,rainbow:sat>65}[topic.palette];
  if(match)matching++;
 }
 const coverage=ink/(160*114),colorFit=ink?matching/ink:0;
 const variety=Math.min(1,drawColors.size/5);
 const effort=Math.min(1,drawStrokes/22)*.6+Math.min(1,drawSegments/2400)*.4;
 const composition=Math.min(1,cells.size/36)*.5+Math.min(1,center/Math.max(ink,1)/.6)*.5;
 const spread=Math.min(1,Math.min(top,bottom)/Math.max(ink,1)/.16);
 const detail=Math.min(1,drawStrokes/35)*.55+Math.min(1,drawSegments/4000)*.45;
 let raw=100*(.16*Math.min(1,coverage/.30)+.14*colorFit+.18*composition+.13*variety+.19*effort+.12*detail+.08*spread);
 // 単色塗り・短い落書きが高得点にならないよう上限を設定。
 let cap=100;
 if(drawStrokes<4)cap=24;else if(drawStrokes<8)cap=40;else if(drawStrokes<14)cap=58;else if(drawStrokes<22)cap=73;
 if(coverage<.035)cap=Math.min(cap,25);else if(coverage<.09)cap=Math.min(cap,46);
 if(variety<.22)cap=Math.min(cap,57);
 if(coverage>.70&&drawColors.size<=2)cap=Math.min(cap,40);
 const score=Math.max(0,Math.min(cap,Math.round(raw*.82)));
 return {score,colorMatch:Math.round(colorFit*100),coverage:Math.round(coverage*100),structure:Math.round(composition*100)};
}

// Sale-price lottery: 95% = 1–9,999; 4.9% = 10,000–99,998;
// 0.1% = 99,999. Within each band, expensive outcomes become progressively rarer.
function drawCardSalePrice(score){
 // High-value prizes retain 5% total probability (including 0.1% jackpot).
 // Ordinary payouts scale strongly with drawing quality; a masterpiece never earns single digits.
 const quality=Math.max(0,Math.min(1,score/100));
 const roll=Math.random();
 if(roll<.001)return 99999;
 if(roll<.05){
  const u=Math.pow(Math.random(),2.7);
  return Math.max(10000,Math.min(99998,10000+Math.floor(89998*u*(.2+.8*quality))));
 }
 const min=score>=98?9000:score>=88?6500:score>=72?3500:score>=48?800:score>=23?80:1;
 const max=score>=98?9999:score>=88?9999:score>=72?8000:score>=48?4500:score>=23?1200:350;
 const u=Math.pow(Math.random(),score>=88?1.2:1.6);
 return Math.max(min,Math.min(9999,min+Math.floor((max-min)*u)));
}

 const topicName=assignedCardTopic?.name||'';const theme=EXTRA_CARD_THEMES.find(t=>t.keys.some(k=>(title+' '+topicName).includes(k)))||CUSTOM_THEMES.find(t=>t.keys.some(k=>(title+' '+topicName).includes(k)));

 const subject=(title||topicName||'謎の一枚').slice(0,18);

 ];

 return {rarity,attribute:customPick(CUSTOM_ATTRIBUTES),attack:val(),defense:val(),skill,flavor,sideEffect:Math.random()<.55?customPick(customSide):fx[0],ownerQuote:Math.random()<.55?customPick(customOwner):fx[1],number:'OC-'+String(Math.floor(Math.random()*90000)+10000)};

function renderCustomCard(art,title,meta){return new Promise(resolve=>{
 const frame=new Image();frame.onload=()=>{
  const c=document.createElement('canvas');c.width=800;c.height=1096;const x=c.getContext('2d');
  x.drawImage(frame,0,0,800,1096);
  const sx=800/1391,sy=1096/1906;
  const rect=(a,b,w,h)=>[a*sx,b*sy,w*sx,h*sy];
  const box=(px,py,w,h,fill,stroke='#a77b30',lw=2)=>{x.fillStyle=fill;x.fillRect(px,py,w,h);if(stroke){x.strokeStyle=stroke;x.lineWidth=lw;x.strokeRect(px+1,py+1,w-2,h-2)}};
  const font=(size,bold=false)=>{x.font=(bold?'bold ':'')+size+'px "Noto Sans JP",sans-serif'};
  const fit=(str,max,base=26,min=13)=>{let z=base;font(z,true);while(z>min&&x.measureText(str).width>max){z--;font(z,true)}return z};
  const wrap=(str,max,size,lines)=>{font(size);let result=[],line='';for(const ch of str){if(line&&x.measureText(line+ch).width>max){result.push(line);line=''}line+=ch}if(line)result.push(line);if(result.length>lines){result=result.slice(0,lines);let last=result[lines-1];while(last&&x.measureText(last+'…').width>max)last=last.slice(0,-1);result[lines-1]=last+'…'}return result};
  const textLines=(str,px,py,max,size,lines,lineHeight,color)=>{x.fillStyle=color;font(size);wrap(str,max,size,lines).forEach((t,i)=>x.fillText(t,px,py+i*lineHeight))};
  // The top of the supplied frame is left unboxed, like the reference trading card.
  box(154,86,453,105,'#0c0905',null);
  x.textAlign='center';x.textBaseline='middle';x.fillStyle='#e6b65b';
  const name=title||'無題のトレカ';fit(name,430,59,13);x.fillText(name,380,143,430);
  // Preserve every part of the drawing: the drawing canvas has the same ratio as this slot.
  const slot=rect(195,389,1000,710);x.fillStyle='#fff';x.fillRect(...slot);
  const img=new Image();img.onload=()=>{x.drawImage(img,...slot);finish()};img.onerror=finish;img.src=art;
  function finish(){
   x.textAlign='center';x.textBaseline='middle';x.lineWidth=4;x.strokeStyle='#f8f2d8';x.fillStyle=meta.rarity==='N'?'#c63831':meta.rarity==='R'?'#3186c8':meta.rarity==='SR'?'#a85fd4':meta.rarity==='UR'?'#d59d25':'#df3c76';
   font(meta.rarity.length>1?30:38,true);x.strokeText(meta.rarity,665,210,90);x.fillText(meta.rarity,665,210,90);
   // Information starts directly beneath the artwork and follows the supplied real-card design.
   box(105,651,590,45,'#761e23','#e7bd64',3);
   x.textAlign='left';x.textBaseline='middle';x.fillStyle='#fff2d6';font(19,true);x.fillText('◆ '+meta.attribute+'属性',123,674);
   x.textAlign='right';font(16,true);x.fillText('ATK '+meta.attack+'   DEF '+meta.defense,680,674);
   // Card story (left), signature move and side effect (right).
   box(105,704,342,248,'#f9f2df','#aa6e43',3);
   box(455,704,240,120,'#fff7e8','#ae673e',3);
   box(455,831,240,121,'#f7eef7','#89579d',3);
   x.textAlign='left';x.textBaseline='alphabetic';x.fillStyle='#7b3b21';font(16,true);x.fillText('◆ カードストーリー',120,729);
   textLines(meta.flavor,121,761,311,20,7,27,'#3b2c27');
   x.fillStyle='#a83b25';font(17,true);x.fillText('✦ 必殺技',468,729);
   x.fillStyle='#912d23';fit(meta.skill,212,20,13);x.fillText(meta.skill,469,757,211);
   x.fillStyle='#a07442';font(13);x.fillText('SPECIAL MOVE',469,801);
   x.fillStyle='#7440a0';font(17,true);x.fillText('☠ 副作用',468,855);
   textLines(meta.sideEffect||'たまに自分がびっくりする。',468,879,212,16,3,20,'#3e3043');
   // Owner quote: distinct footer ribbon.
   box(105,959,590,58,'#24180f','#d7ae60',2);
   x.textAlign='left';x.textBaseline='alphabetic';x.fillStyle='#e9c77d';font(13,true);x.fillText('店主の一言',120,978);
   textLines(meta.ownerQuote||'店主「ほどほどにしてください。」',120,1000,555,18,1,19,'#fff3db');
   x.textAlign='left';x.fillStyle='#e6bb76';font(14,true);x.fillText(meta.number||'OC-00000',108,1038);
   x.textAlign='center';font(14,true);x.fillText('◆ TAKOYAKI ORIGINAL CARD ◆',402,1038);
   resolve(c.toDataURL('image/jpeg',.94));
  }
 };frame.onerror=()=>resolve(art);frame.src=CUSTOM_CARD_FRAME;
})}

ent(post);const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener noreferrer';document.body.appendChild(a);a.click();a.remove();const fallback=$('shareFallback');if(fallback)fallback.style.display='block'})()};$('copyCustomPost').onclick=async()=>{const post='自作トレカ「'+title+'」を作りました！🎴\nhttps://takoyaki-card.com/\n#たこ焼きトレカ #自作トレカ';try{await navigator.clipboard.writeText(post);alert('投稿文をコピーしました')}catch(e){prompt('この文章をコピーしてください',post)}};$('confirmShareCard').onclick=()=>{const card=Array.isArray(state.madeCards)?state.madeCards.find(c=>c.image===image):null;if(!card){alert('カード保存後にもう一度お試しください');return}if(card.shareBonusClaimed){alert('このカードのボーナスは受取済みです');return}card.shareBonusClaimed=true;const bonus=3;state.stats.tech=Math.min(100,state.stats.tech+bonus);save();$('confirmShareCard').disabled=true;$('confirmShareCard').textContent='✅ 技術 +3 受取済み';alert('技術 +3！ ※投稿確認は行わないサンプル仕様です')};$('quickSaveCard').onclick=()=>$('saveCustomCard').click();$('quickShareCard').onclick=()=>$('shareCustomCard').click();$('customDone').onclick=()=>{document.body.classList.remove('showingCardResult');close();render()}}

 });});

}

  g.fillStyle=player?'#ffe26b':'#fff';g.strokeStyle='#16223c';g.lineWidth=3;g.font='bold 13px sans-serif';g.textAlign='center';g.strokeText(player?'YOU':label.slice(0,6),cx,cy-size/2-12);g.fillText(player?'YOU':label.slice(0,6),cx,cy-size/2-12);

function radarSVG(current, predicted){

 const cx=160,cy=151,R=100,scale=100;
 const pt=(i,v)=>{const ang=-Math.PI/2+i*2*Math.PI/5;const r=R*Math.max(0,v)/scale;return [(cx+Math.cos(ang)*r).toFixed(1),(cy+Math.sin(ang)*r).toFixed(1)].join(',')};
 const poly=v=>keys.map((k,i)=>pt(i,v[k]||0)).join(' ');
 let out='<svg viewBox="0 0 320 315" class="radarChart" role="img" aria-label="青は現在の能力、赤はトレーニング後の予測能力">';
 for(let t=1;t<=5;t++)out+='<polygon points="'+keys.map((k,i)=>pt(i,scale*t/5)).join(' ')+'" fill="none" stroke="#c2b292" stroke-width="1"/>';
 for(let i=0;i<5;i++){const ang=-Math.PI/2+i*2*Math.PI/5;out+='<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+Math.cos(ang)*R)+'" y2="'+(cy+Math.sin(ang)*R)+'" stroke="#c2b292"/>';out+='<text x="'+(cx+Math.cos(ang)*126)+'" y="'+(cy+Math.sin(ang)*126+5)+'" text-anchor="middle" font-size="13" font-weight="bold" fill="#514531">'+names[i]+'</text>'}
 out+='<polygon points="'+poly(current)+'" fill="#287bd329" stroke="#287bd3" stroke-width="3"/>';
 out+='<polygon points="'+poly(predicted)+'" fill="#e23b3b22" stroke="#e23b3b" stroke-width="4"/>';
 return out+'</svg><div class="radarLegend"><span style="color:#287bd3">━ 現在</span><span style="color:#d32f2f">━ 実行後の予測</span></div>';
}

trong id=\"time\">60.0\u003c/strong>\u003c/div>\u003c/div>\u003cdiv class=\"progress\" id=\"progress\">\u003c/div>\u003cdiv id=\"bossHUD\" class=\"boss-hud\" hidden>\u003cdiv>🔥 FINAL BOSS \u003cspan id=\"bossPhase\">PHASE 1\u003c/span>\u003c/div>\u003cdiv class=\"boss-meter\">\u003cdiv id=\"bossMeter\">\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"float\" id=\"float\">\u003c/div>\u003cdiv class=\"overlay\" id=\"overlay\">\u003cdiv class=\"panel\" id=\"panel\">\u003ch1>🚀 たこ焼き JET RUSH\u003c/h1>\u003cp>たこ焼きを集めて障害物を撃破！最後は炎を放つボスとの決戦！ ♥がなくなるとゲームオーバー！\u003c/p>\u003cdiv class=\"choices\" id=\"choices\">\u003c/div>\u003cp id=\"skillDesc\">タコ民を選ぼう\u003c/p>\u003cbutton class=\"cta\" id=\"start\">▶ スタート！\u003c/button>\u003cp>上下左右に自由移動 ／ 🔥ショット ／ ⚡必殺技\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"controls\">\u003cdiv class=\"pad\" id=\"pad\">↕ ↔ ここをなぞって自由移動\u003cbr>移動中も別の指で必殺技OK\u003c/div>\u003cdiv class=\"btns\">\u003cbutton class=\"action fire\" id=\"fire\">🔥\u003cbr>ショット\u003c/button>\u003cbutton class=\"action special\" id=\"special\">⚡\u003cbr>必殺技\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"hint\">\u003cspan style=\"background:#17604e;color:#baffd8;font-weight:900\">🟢 GET＝取ってOK\u003c/span>\u003cspan style=\"background:#6c233c;color:#ffd3d8;font-weight:900\">🔴 赤い枠＝敵・避ける／撃つ\u003c/span>\u003cspan>♥ ライフ回復\u003c/span>\u003cspan>◆ 8秒バリア\u003c/span>\u003cspan>🐦 カラス +250点 ／ ✈️ 紙飛行機・🦑 イカ・👻 ゴースト +350点 ／ 🍡 たこ焼き +100点\u003c/span>\u003cspan>💥 撃破 +200点\u003c/span>\u003cspan>✨ 連続取得で倍率UP\u003c/span>\u003c/div>\u003cp class=\"note\">※60秒後に巨大な炎のボスが登場。ボスのHPが減ると攻撃パターンが変化。♥3つを守って撃破しよう！ ♥回復・◆バリアアイテムも登場！ 育成大会のレース画面です。\u003c/p>\u003c/div>\u003cscript>\nconst JET_CFG=__JET_CONFIG__;\nconst JET_BOSS_HP=[140,165,190,220,250,290];\nconst JET_STAGE=Math.max(0,Math.min(5,Math.floor(Number(JET_CFG.race)||0)));\n\u003c/script>\u003cscript>\n'use strict';\nconst cv=document.getElementById('game'),c=cv.getContext('2d'),$=id=>document.getElementById(id);cv.style.aspectRatio='auto'; rank];\n const status=clear?'🏁 完走！':'💥 GAME OVER';\n const qualified=clear&&score>=target;\n const resultText=qualified?'大会クリア！ 育成を続けられます':clear?'目標点に届かず。育成終了':'完走できず。育成終了';\n document.body.classList.add('resultMode');document.documentElement.classList.add('resultMode');\n window.scrollTo(0,0);\n const panel=$('panel');\n panel.classList.add('resultPanel');\n $('overlay').classList.remove('hide');\n panel.innerHTML=`\n  \u003cdiv class=\"resultTop\">\n   \u003cdiv>\u003cdiv class=\"resultEyebrow\">JET RUSH · RACE RESULT\u003c/div>\u003cdiv class=\"resultTitle\">${status}\u003c/div>\n    \u003cdiv class=\"resultStatus ${qualified?'':'fail'}\">${resultText}\u003c/div>\u003c/div>\n   \u003cimg class=\"resultPortrait\" src=\"${RIVAL_IMAGES[selected]}\" alt=\"${roster[selected].name}\">\n  \u003c/div>\n  \u003cdiv class=\"resultDialogue\">💬 ${quote}\u003c/div>\n  \u003cdiv class=\"resultScoreBox\">\u003cdiv class=\"resultScoreLabel\">TOTAL SCORE\u003c/div>\n   \u003cdiv class=\"resultScoreNumber\">${score.toLocaleString()} \u003csmall style=\"font-size:.43em\">PTS\u003c/small>\u003c/div>\n   \u003cdiv class=\"resultGoal\">目標 ${target.toLocaleString()} PTS · ${Math.floor(ratio*100)}% 達成\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"rankHead\">\u003cspan>🏆 スコアランク\u003c/span>\u003cstrong>${rank} RANK\u003c/strong>\u003c/div>\n  \u003cdiv class=\"rankBar\" style=\"--rank-position:${progress}%\">\u003cdiv class=\"rankNeedle\">\u003c/div>\u003c/div>\n  \u003cdiv class=\"rankLabels\">\u003cspan>C\u003c/span>\u003cspan>B\u003c/span>\u003cspan>A\u003c/span>\u003cspan>S\u003c/span>\u003c/div>\n  \u003cdiv class=\"resultStats\">\u003cspan>♥ 残りHP ${hp}\u003c/span>\u003cspan>🔫 武器 Lv.${weaponLevel}\u003c/span>\u003cspan>✨ 完走ボーナス +${bonus.toLocaleString()}\u003c/span>${cashOcto?`\u003cspan style=\"color:#ffe785\">💴 札束乱舞 +${cashOcto.toLocaleString()} OCTO${JET_CFG.practice?\"（練習）\":\"\"}\u003c/span>`:\"\"}\u003c/div>\n  \u003cdiv class=\"resultActions\">\n   \u003cbutton class=\"mainAction\" id=\"backTraining\">🏠 ${JET_CFG.practice?'育成ゲームに戻る':'結果を反映して育成に戻る'}\u003c/button>\n   \u003cbutton class=\"retryAction\" id=\"again\">↻ もう一度\u003c/button>\n   \u003cbutton class=\"chooseAction\" id=\"selectAgain\">🐙 タコ民を変更\u003c/button>\n  \u003c/div>\n  \u003cdiv class=\"resultNote\">※ランクは得点評価です。大会突破には目標点と完走の両方が必要です。\u003c/div>`;\n $('backTraining').onclick=()=>parent.postMessage({type:'takoyaki-jet-finished',clear,score,hp,rank,cashOcto,character:roster[selected].name,bossIndex:JET_CFG.bossIndex,race:JET_CFG.race},'*');\n $('again').onclick=reset;\n $('selectAgain').onclick=()=>location.reload();\n}\n\nfunction summonBoss(){\n const max=JET_BOSS_HP[JET_STAGE],weak=15+JET_STAGE*3;goal=true;boss={x:1150,y:340,hp:max,max,clock:0,attack:0,phase:1,entering:true,dead:false,weakpoints:[{id:'left',dx:-82,dy:-78,hp:weak,max:weak,dead:false},{id:'right',dx:90,dy:-64,hp:weak,max:weak,dead:false}]};\n bossShots=[];bossWarning=2.5;obstacles=[];items=[];wildEnemies=[];formationEnemies=[];warningHazards=[];$('bossHUD').hidden=false;pop('⚠️ GIANT BOSS!');\n}\nfunction defeatBoss(){\n if(!boss||boss.dead)return;boss.dead=true;bossVictory=true;bossShots=[];let bossBonus=(JET_CFG.race===5?5000:1500+JET_CFG.race*500)+hp*600;score+=bossBonus;floatingScore(bossBonus,boss.x-75,boss.y,'BOSS BONUS');burst(boss.x,boss.y,'#ffb94b',85,2.2);shake=1.1;pop('🔥 BOSS DEFEATED!');\n setTimeout(()=>{if(playing){boss=null;$('bossHUD').hidden=true;goalX=1100;gatePassed=false;pop('🏁 GOAL!')}},1400);\n}\nfunction bossAttack(){\n if(!boss||boss.dead)return;\n const phase=boss.phase;const shotStart=bossShots.length;\n if(phase===1){\n  // diagonal fan: multiple trajectories with enough gaps for dodging\n  for(let j=-(boss.weakpoints.filter(w=>!w.dead).length?2:1);j\u003c=(boss.weakpoints.filter(w=>!w.dead).length?2:1);j++){let angle=Math.PI+(j*.18);bossShots.push({x:boss.x-82,y:boss.y+20,vx:Math.cos(angle)*330,vy:Math.sin(angle)*330,r:13,life:4})}\n }else if(phase===2){\n  // aimed bursts at player dColorStop(0,'#fff6ba');gr.addColorStop(.4,'#ffae32');gr.addColorStop(.72,'#f04420');gr.addColorStop(1,'#e52d1500');\n  c.fillStyle=gr;c.beginPath();c.arc(0,0,r*2.2,0,7);c.fill();c.restore()\n }\n}\n\n// Enemy formations: V-shaped crow squadrons with a perfect-clear reward.\nfunction spawnFormation(){\n const id=++formationSeq,center=rand(230,570),count=5;\n for(let k=0;k\u003ccount;k++)formationEnemies.push({id,x:1040+k*67,y:center+Math.abs(k-2)*48,baseY:center+Math.abs(k-2)*48,r:25,hp:1,dead:false,age:0});\n pop('🐦 CROW FORMATION!');\n}\nfunction updateFormation(dt){\n if(!goal&&JET_CFG.race>=1){formationClock-=dt;if(formationClock\u003c=0){spawnFormation();formationClock=rand(JET_CFG.race>=3?9:12,JET_CFG.race>=3?13:17)}}\n for(const e of formationEnemies){if(e.dead)continue;e.age+=dt;if(activeSkill==='reverse'&&reverseEnemy(e,dt))continue;e.x-=535*dt;if(activeSkill==='line')lineEnemy(e,dt);if(!e.dead&&Math.hypot(e.x-(player.x+25),e.y-player.y)\u003ce.r+27){e.dead=true;e.escaped=true;hitObstacle(e)}}\n const ids=new Set(formationEnemies.map(e=>e.id));\n for(const id of ids){const group=formationEnemies.filter(e=>e.id===id);if(group.length&&group.every(e=>e.dead||e.x\u003c-50||(e.escaped&&e.x>W+90))){\n  if(group.every(e=>e.dead&&!e.escaped)){addScore(2000,player.x+140,player.y-80);pop('✨ PERFECT +2000!')}\n  formationEnemies=formationEnemies.filter(e=>e.id!==id);\n }}\n}\nfunction drawFormation(){for(const e of formationEnemies){if(e.dead)continue;c.save();c.translate(e.x,e.y);if(e.reversing)c.scale(-1,1);c.fillStyle='#121727';c.beginPath();c.ellipse(0,0,21,15,0,0,7);c.fill();const flap=Math.sin(e.age*23)*13;c.beginPath();c.moveTo(-7,0);c.lineTo(-35,-12-flap);c.lineTo(-12,9);c.fill();c.beginPath();c.moveTo(7,0);c.lineTo(35,-12-flap);c.lineTo(12,9);c.fill();c.fillStyle='#f3bd32';c.beginPath();c.moveTo(-22,1);c.lineTo(-34,6);c.lineTo(-22,10);c.fill();c.fillStyle='white';c.fillRect(-10,-7,5,5);c.restore()}}\n// Telegraph a danger lane before a damaging energy sweep.\nfunction spawnHazard(){warningHazards.push({y:rand(155,665),clock:0,state:'warn',hit:false});pop('⚠️ DANGER LINE!')}\nfunction updateHazards(dt){\n if(!goal&&JET_CFG.race>=2){hazardClock-=dt;if(hazardClock\u003c=0){spawnHazard();hazardClock=rand(JET_CFG.race>=4?9:12,JET_CFG.race>=4?14:18)}}\n for(const h of warningHazards){h.clock+=dt;if(h.state==='warn'&&h.clock>=2){h.state='fire';h.clock=0;shake=Math.max(shake,.25)}\n if(h.state==='fire'&&!h.hit&&Math.abs(player.y-h.y)\u003c31){h.hit=true;hitObstacle(h)}\n }warningHazards=warningHazards.filter(h=>h.clock\u003c(h.state==='warn'?2:.65));\n}\nfunction drawHazards(){for(const h of warningHazards){c.save();if(h.state==='warn'){c.globalAlpha=.45+Math.sin(h.clock*18)*.25;c.fillStyle='#ff5252';c.fillRect(0,h.y-4,W,8);c.font='bold 18px sans-serif';c.textAlign='right';c.fillText('⚠️ 2秒後に攻撃',W-25,h.y-14)}else{c.globalAlpha=.9;c.shadowColor='#ff613b';c.shadowBlur=25;c.fillStyle='#ff572b';c.fillRect(0,h.y-22,W,44);c.fillStyle='#fff6a4';c.fillRect(0,h.y-8,W,16)}c.restore()}}\nfunction weakpointHit(b){\n if(!boss||boss.dead)return false;\n for(const w of boss.weakpoints){if(w.dead)continue;const x=boss.x+w.dx,y=boss.y+w.dy;if(Math.hypot(b.x-x,b.y-y)\u003c28+b.r){b.dead=true;w.hp=Math.max(0,w.hp-b.damage);burst(x,y,'#8bfaff',9,.35);if(w.hp\u003c=0){w.dead=true;addScore(1500,x,y,'WEAK POINT');pop('💥 WEAK POINT BROKEN!');boss.hp=Math.max(0,boss.hp-9);if(boss.hp===0){skillImpact(boss.x,boss.y,'ドゴォォン!!','#ffb665');defeatBoss()}}return true}}\n return false;\n}\nfunction drawWeakpoints(){if(!boss||boss.dead)return;for(const w of boss.weakpoints){if(w.dead)continue;const x=boss.x+w.dx,y=boss.y+w.dy;c.save();c.shadowColor='#76f7ff';c.shadowBlur=18;c.strokeStyle='#8af8ff';c.lineWidth=4;c.beginPath();c.arc(x,y,22+Math.sin(elapsed*7)*3,0,7);c.stroke();c.fillStyle='#fff';c.font='bold 15px sans-serif';c.textAlign='center';c.fillText('◎',x,y+5);c.fillStyle='#202434';c.fillRect(x-22,y-34,44,5);c.fillStyle='#71e8ff';c.fillRect(x-22,y-34,44*w.h
