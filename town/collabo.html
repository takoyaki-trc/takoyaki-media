<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>コラボ図鑑｜焼かれた伝説</title>
  <meta name="description" content="年号でまとめたコラボ図鑑。" />

  <style>
    :root{
      --text:#fff;
      --muted:rgba(255,255,255,.76);
      --line:rgba(255,255,255,.16);
      --bg-url: url("https://ul.h3z.jp/G7grA8Dy.png");
      --panel: rgba(16, 10, 14, .78);
      --panel2: rgba(10, 8, 12, .66);
      --gold:#f2d07a;
      --gold2:#b8943b;
      --blue:#2f8bff;
      --blue2:#0f5fbf;
      --shadow: 0 18px 55px rgba(0,0,0,.55);
      --shadow2: 0 10px 22px rgba(0,0,0,.35);
      --radius: 14px;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      color:var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans JP", sans-serif;
      background-image: var(--bg-url);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      overflow-x:hidden;
    }

    a{color:inherit;text-decoration:none}
    button{font:inherit}

    .frame{
      position: fixed;
      inset: 10px;
      pointer-events:none;
      z-index: 1;
      border-radius: 18px;
      border: 2px solid rgba(242,208,122,.55);
      box-shadow: inset 0 0 0 2px rgba(0,0,0,.18);
    }
    .frame::before,
    .frame::after{
      content:"";
      position:absolute;
      top:10px; bottom:10px;
      width:14px;
      background:
        linear-gradient(to bottom,
          rgba(242,208,122,.55) 0 8px,
          transparent 8px 16px) repeat-y;
      background-size: 14px 16px;
      opacity:.65;
    }
    .frame::before{ left:10px; }
    .frame::after { right:10px; }

    .header{
      position: sticky;
      top:0;
      z-index: 5;
      padding: 10px 10px 8px;
    }
    .headbar{
      display:flex;
      align-items:center;
      gap:10px;
      padding:10px 10px;
      border-radius: 14px;
      background: rgba(40, 14, 20, .78);
      border: 1px solid rgba(255,255,255,.14);
      box-shadow: var(--shadow2);
      backdrop-filter: blur(6px);
    }
    .back{
      width:46px; height:46px;
      display:grid; place-items:center;
      border:1px solid rgba(255,255,255,.18);
      background: rgba(0,0,0,.22);
      color:#fff;
      border-radius: 10px;
      cursor:pointer;
    }
    .titlebox{min-width:0;flex:1}
    .title{
      font-weight: 1000;
      letter-spacing:.04em;
      font-size: 18px;
      line-height: 1.15;
    }

    .wrap{
      position: relative;
      z-index: 2;
      max-width: 980px;
      margin: 0 auto;
      padding: 8px 12px 44px;
    }

    .banner{
      border-radius: 16px;
      border:1px solid rgba(242,208,122,.40);
      background: rgba(18, 10, 14, .72);
      box-shadow: var(--shadow);
      overflow:hidden;
      position:relative;
      padding: 14px 14px 12px;
      margin: 6px 0 10px;
      backdrop-filter: blur(6px);
    }
    .banner::before{
      content:"";
      position:absolute;
      inset:-2px;
      background:
        radial-gradient(900px 260px at 18% 0%, rgba(242,208,122,.24), transparent 60%),
        radial-gradient(700px 220px at 80% 15%, rgba(47,139,255,.16), transparent 60%),
        radial-gradient(520px 240px at 60% 95%, rgba(255,255,255,.08), transparent 65%);
      pointer-events:none;
      opacity:.95;
    }
    .banner > *{position:relative}
    .banner h1{
      margin:0;
      font-size: 16px;
      font-weight:1000;
      letter-spacing:.05em;
    }
    .banner p{
      margin:8px 0 0;
      color: rgba(255,255,255,.86);
      font-size: 12.5px;
      line-height: 1.65;
      font-weight: 900;
    }

    .year{
      border-radius: 16px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(10, 8, 12, .58);
      box-shadow: var(--shadow2);
      overflow:hidden;
      backdrop-filter: blur(6px);
    }
    .year + .year{ margin-top: 12px; }

    .year-head{
      display:flex;
      align-items:center;
      gap:10px;
      padding: 12px 12px;
      border-bottom: 1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.18);
    }
    .year-num{
      font-size: 22px;
      font-weight: 1000;
      letter-spacing:.04em;
    }
    .year-sub{
      color: rgba(255,255,255,.78);
      font-weight: 900;
      font-size: 12px;
      letter-spacing:.02em;
    }

    .list{
      padding: 10px;
      display:grid;
      gap: 10px;
    }

    .sectionCap{
      display:flex;
      align-items:center;
      gap:10px;
      margin: 6px 2px 0;
      padding: 6px 2px 0;
      color: rgba(255,255,255,.78);
      font-weight:1000;
      font-size: 12px;
      letter-spacing:.02em;
    }
    .capLine{
      flex:1;
      height:1px;
      background: rgba(255,255,255,.10);
    }

    .row{
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.22);
      box-shadow: var(--shadow2);
      padding: 10px 10px;
      display:flex;
      align-items:center;
      gap: 10px;
      cursor:pointer;
      min-width: 0;
    }
    .row:active{ transform: translateY(1px); }

    .thumb{
      width: 64px;
      height: 64px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(0,0,0,.25);
      overflow:hidden;
      flex: 0 0 auto;
      display:grid;
      place-items:center;
    }
    .thumb img{
      width:100%;
      height:100%;
      object-fit: cover;
      display:block;
    }

    .row-main{ min-width:0; flex:1 1 auto; }
    .row-title{
      font-weight: 1000;
      font-size: 16px;
      letter-spacing:.02em;
      white-space: nowrap;
      overflow:hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }
    .row-meta{
      margin-top: 4px;
      display:flex;
      align-items:center;
      gap: 8px;
      flex-wrap: wrap;
      color: rgba(255,255,255,.78);
      font-weight: 900;
      font-size: 12px;
      min-width:0;
    }

    .badges{
      display:flex;
      align-items:center;
      gap: 8px;
      flex: 0 0 auto;
    }
    .badge{
      padding: 8px 10px;
      border-radius: 0px;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(0,0,0,.20);
      font-weight:1000;
      font-size: 13px;
      line-height:1;
      white-space:nowrap;
    }
    .badge.paper{
      border-color: rgba(242,208,122,.55);
      background: rgba(242,208,122,.16);
    }
    .badge.digital{
      border-color: rgba(47,139,255,.65);
      background: rgba(47,139,255,.18);
    }

    .chev{
      width: 34px;
      height: 34px;
      display:grid;
      place-items:center;
      border-radius: 10px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.18);
      flex: 0 0 auto;
      font-weight:1000;
    }

    .modal{
      position: fixed;
      inset: 0;
      z-index: 50;
      display:none;
      background: rgba(0,0,0,.70);
      backdrop-filter: blur(8px);
      padding: 14px;
      align-items: center;
      justify-content: center;
    }
    .modal[aria-hidden="false"]{ display:flex; }

    .mcard{
      width: min(980px, 100%);
      max-height: min(92vh, 920px);
      overflow:auto;
      border-radius: 16px;
      border: 1px solid rgba(242,208,122,.35);
      background: rgba(18, 10, 14, .92);
      box-shadow: 0 28px 90px rgba(0,0,0,.78);
    }
    .mtop{
      position: sticky;
      top:0;
      z-index: 2;
      display:flex;
      align-items:center;
      gap:10px;
      padding: 12px 12px;
      border-bottom: 1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.22);
      backdrop-filter: blur(6px);
    }
    .mtitle{
      font-weight:1000;
      font-size: 14px;
      min-width:0;
      overflow:hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex:1;
    }
    .mclose{
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(0,0,0,.22);
      color:#fff;
      padding: 10px 12px;
      cursor:pointer;
      font-weight:1000;
    }

    .mbody{ padding: 12px; display:grid; gap: 12px; }

    .block{
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.20);
      box-shadow: var(--shadow2);
      padding: 12px;
    }

    .profile{
      display:grid;
      grid-template-columns: 110px 1fr;
      gap: 12px;
      align-items: start;
    }
    .pimg{
      width: 110px;
      height: 110px;
      border-radius: 12px;
      overflow:hidden;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(0,0,0,.22);
    }
    .pimg img{
      width:100%;
      height:100%;
      object-fit: cover;
      display:block;
    }

    .profileSide{
      width: 110px;
      display:grid;
      gap:8px;
      align-content:start;
    }

    .profileLinks{
      display:grid;
      gap:6px;
    }

    .profileLink{
      width:100%;
      min-height:34px;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:7px 8px;
      border-radius:8px;
      border:1px solid rgba(242,208,122,.52);
      background:rgba(242,208,122,.14);
      color:#fff;
      font-size:11px;
      font-weight:1000;
      line-height:1.25;
      text-align:center;
      box-shadow:0 5px 12px rgba(0,0,0,.20);
    }

    .profileLink:hover{
      background:rgba(242,208,122,.23);
    }

    .profileLink.x{
      border-color:rgba(255,255,255,.32);
      background:rgba(255,255,255,.09);
    }

    .profileLink.shop{
      border-color:rgba(47,139,255,.60);
      background:rgba(47,139,255,.16);
    }

    .ptext .name{
      margin:0;
      font-weight:1000;
      font-size: 18px;
      line-height:1.2;
    }
    .ptext .small{
      margin-top:6px;
      color: rgba(255,255,255,.82);
      font-weight:900;
      font-size: 12px;
    }
    .ptext .desc{
      margin:10px 0 0;
      color: rgba(255,255,255,.86);
      font-weight:900;
      font-size: 13px;
      line-height: 1.75;
      white-space: pre-wrap;
    }

    .seed{
      display:grid;
      grid-template-columns: 100px 1fr;
      gap: 12px;
      align-items: start;
    }
    .seedbox{
      width: 100px;
      height: 100px;
      border-radius: 12px;
      overflow:hidden;
      border: 1px solid rgba(242,208,122,.40);
      background: rgba(0,0,0,.18);
      display:grid;
      place-items:center;
    }
    .seedbox img{
      width:100%;
      height:100%;
      object-fit: contain;
      display:block;
    }
    .seedtext .topline{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      align-items:center;
    }
    .label-digital,
    .label-paper{
      display:inline-block;
      padding: 6px 10px;
      border-radius: 0px;
      font-weight:1000;
      font-size: 12px;
      line-height: 1;
      white-space:nowrap;
    }
    .label-digital{
      border: 1px solid rgba(47,139,255,.70);
      background: rgba(47,139,255,.18);
    }
    .label-paper{
      border: 1px solid rgba(242,208,122,.65);
      background: rgba(242,208,122,.16);
    }
    .seedtext .stitle{
      font-weight:1000;
      font-size: 14px;
    }
    .seedtext .sdesc{
      margin:8px 0 0;
      color: rgba(255,255,255,.86);
      font-weight:900;
      font-size: 13px;
      line-height: 1.75;
      white-space: pre-wrap;
    }

    .cards{
      display:grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .c{
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.18);
      overflow:hidden;
      box-shadow: var(--shadow2);
    }
    .cimg{
      aspect-ratio: 5 / 7;
      background: rgba(0,0,0,.22);
      display:grid;
      place-items:center;
      border-bottom: 1px solid rgba(255,255,255,.10);
      padding: 8px;
    }
    .cimg img{
      width:100%;
      height:100%;
      object-fit: contain;
      display:block;
      filter: drop-shadow(0 10px 18px rgba(0,0,0,.45));
    }
    .cmeta{
      padding: 10px;
      display:flex;
      align-items:center;
      justify-content: space-between;
      gap: 10px;
    }
    .cno{
      font-weight:1000;
      font-size: 14px;
      white-space: nowrap;
      overflow:hidden;
      text-overflow: ellipsis;
    }
    .miniBadge{
      padding: 6px 10px;
      border-radius: 0px;
      border: 1px solid rgba(47,139,255,.70);
      background: rgba(47,139,255,.20);
      font-weight:1000;
      font-size: 12px;
      line-height: 1;
      white-space:nowrap;
    }
    .miniBadge.paper{
      border-color: rgba(242,208,122,.60);
      background: rgba(242,208,122,.18);
    }

    .note{
      color: rgba(255,255,255,.86);
      font-weight:900;
      font-size: 12.5px;
      line-height: 1.65;
      margin:0;
      white-space: pre-wrap;
    }

    @media (max-width:360px){
      .thumb{ width:56px; height:56px; }
      .badge{ padding: 7px 8px; font-size: 12px; }
      .chev{ width:32px; height:32px; }
      .row{ gap:8px; padding: 9px; }
      .row-title{ font-size: 15px; }
    }

    @media (max-width:380px){
      .profile{ grid-template-columns: 98px 1fr; }
      .pimg{ width:98px; height:98px; }
      .profileSide{ width:98px; }
      .seed{ grid-template-columns: 92px 1fr; }
      .seedbox{ width:92px; height:92px; }
    }
  </style>
</head>

<body>
  <div class="frame" aria-hidden="true"></div>

  <header class="header">
    <div class="headbar">
      <button class="back" id="backBtn" type="button" aria-label="戻る">←</button>
      <div class="titlebox">
        <div class="title">コラボ図鑑</div>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="banner" aria-label="案内">
      <h1>焼かれた記録 — コラボ年表</h1>
      <p>
        ✅ シリアルで増えるのはカードではなく「コラボのタネ」。<br>
        ✅ 畑で育てて収穫した瞬間、デジタルカードとして図鑑に刻まれます。<br>
        ✅ たこ焼きフェスでは、食べ比べチケット購入者にフェスのタネのシリアルコードを配布。
      </p>
    </section>

    <section class="year" aria-label="2026年">
      <div class="year-head">
        <div class="year-num">2026年</div>
        <div class="year-sub">ダーツプロ / イラストレーター / たこ焼きフェス / 配信者 / インフルエンサー</div>
      </div>
      <div class="list" id="list2026"></div>
    </section>

    <section class="year" aria-label="2025年">
      <div class="year-head">
        <div class="year-num">2025年</div>
        <div class="year-sub">ダーツプロコラボ（期限なし）</div>
      </div>
      <div class="list" id="list2025"></div>
    </section>

    <section class="year" aria-label="ガイド">
      <div class="year-head">
        <div class="year-num">ガイド</div>
        <div class="year-sub">入手の流れ / 紙の購入案内</div>
      </div>
      <div class="list" id="listGuide"></div>
    </section>
  </main>

  <div class="modal" id="modal" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="mcard" role="document">
      <div class="mtop">
        <div class="mtitle" id="mTitle">—</div>
        <button class="mclose" id="mClose" type="button">閉じる</button>
      </div>
      <div class="mbody" id="mBody"></div>
    </div>
  </div>

  <script>
  (() => {
    "use strict";

    const ABS = "https://takoyaki-trc.github.io/takoyaki-media/";
    const HIMI_CARD = ABS + "town/assets/images/himitu.png";

    const FES_1ST_SEED = ABS + "town/assets/images/tane/1st.png";

    const TAKOYAKI_FES_2026 = [
      {

        profile: {

`6月6日、たこ焼きフェス1日目限定コラボ。

      },
      {

        },
        seed: {

          desc:

        },
        cards: [
          { no: "COL-FES2026-DAY2-01", img: "https://takoyaki-card.com/town/assets/images/collabo/FES26SPD2001.png", kind: "デジタル" },

        ]
      }
    ];

    const GURATAN = {
      id: "guratan",
      title: "ぐらたん",
      period: "2026.3.20〜4.19",
      badges: ["デジタル"],
      thumb: "https://ul.h3z.jp/zXzQtZGi.png",
      profile: {
        name: "配信者《ぐらたん》",
        period: "2026.3.20〜4.19",
        img: "https://ul.h3z.jp/zXzQtZGi.png",
        desc:
`深夜の配信回線に住み着いた語り手。

    const $ = (q) => document.querySelector(q);

    const mClose = $("#mClose");

    $("#backBtn").addEventListener("click", () => history.back());

    function el(tag, cls="", txt=""){
      const e = document.createElement(tag);
      if(cls) e.className = cls;
      if(txt !== "") e.textContent = txt;
      return e;
    }

    function makeBadge(label){
      return el("div", "badge " + (label === "紙" ? "paper" : "digital"), label);
    }

    function makeMiniBadge(kind){
      return el("span", "miniBadge " + (kind === "紙" ? "paper" : "digital"), kind);
    }

    function makeThumb(src, fallbackText=""){
      const box = el("div","thumb");
      if(src){
        const img = document.createElement("img");
        img.src = src;
        img.alt = fallbackText || "";
        box.appendChild(img);
      }
      return box;
    }

    function openModal(title, contentNode){
      mTitle.textContent = title;
      mBody.innerHTML = "";
      mBody.appendChild(contentNode);
      modal.setAttribute("aria-hidden","false");
      document.body.style.overflow = "hidden";
    }

    function closeModal(){
      modal.setAttribute("aria-hidden","true");
      document.body.style.overflow = "";
    }

    mClose.addEventListener("click", closeModal);
    modal.addEventListener("click", (e)=>{ if(e.target === modal) closeModal(); });
    document.addEventListener("keydown", (e)=>{ if(e.key==="Escape" && modal.getAttribute("aria-hidden")==="false") closeModal(); });

    function linkBtn(text, url, cls=""){
      const a = document.createElement("a");
      a.textContent = text;
      a.className = cls || "";
      if(url){
        a.href = url;
        a.target = "_blank";
        a.rel = "noopener";
      }else{
        a.href = "javascript:void(0)";
        a.classList.add("disabled");
      }
      return a;
    }

    function makeRow({thumb, title, period, badges}, onClick){
      const row = el("div","row");
      row.appendChild(makeThumb(thumb, title));

      const main = el("div","row-main");
      main.appendChild(el("div","row-title", title));

      if(period){
        const meta = el("div","row-meta");
        meta.appendChild(el("div","k", period));
        main.appendChild(meta);
      }

      const bwrap = el("div","badges");
      (badges || []).forEach(b => bwrap.appendChild(makeBadge(b)));

      row.appendChild(main);
      row.appendChild(bwrap);
      row.appendChild(el("div","chev","▼"));

      row.addEventListener("click", onClick);
      return row;
    }

    function sectionCap(text){
      const cap = el("div","sectionCap");
      cap.appendChild(el("div","k", text));
      cap.appendChild(el("div","capLine"));
      return cap;
    }

    function cardTile(card){
      const wrap = el("div","c");
      const imgBox = el("div","cimg");

      const img = document.createElement("img");
      img.src = card.img;
      img.alt = card.no || "card";
      imgBox.appendChild(img);

      const meta = el("div","cmeta");
      meta.appendChild(el("div","cno", card.no || "—"));

      const right = el("div","ctags");
      right.appendChild(makeMiniBadge(card.kind || "デジタル"));
      meta.appendChild(right);

      wrap.appendChild(imgBox);
      wrap.appendChild(meta);
      return wrap;
    }

    function profileBlock(p){
      const b = el("section","block");
      const grid = el("div","profile");

      const side = el("div","profileSide");
      const imgBox = el("div","pimg");
      const img = document.createElement("img");
      img.src = p.img;
      img.alt = p.name || "";
      imgBox.appendChild(img);
      side.appendChild(imgBox);

      if(Array.isArray(p.links) && p.links.length){
        const links = el("div","profileLinks");

        p.links.forEach(link => {
          if(!link || !link.url) return;

          const a = document.createElement("a");
          a.href = link.url;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          a.className = `profileLink ${link.type || ""}`.trim();
          a.textContent = link.label || "公式サイト";
          a.addEventListener("click", e => e.stopPropagation());
          links.appendChild(a);
        });

        side.appendChild(links);
      }

      const tx = el("div","ptext");
      tx.appendChild(el("h2","name", p.name || "—"));

      if(p.period) tx.appendChild(el("div","small", `期間：${p.period}`));
      tx.appendChild(el("p","desc", p.desc || ""));

      grid.appendChild(side);
      grid.appendChild(tx);
      b.appendChild(grid);
      return b;
    }

    function seedBlock(s){
      const b = el("section","block");
      const grid = el("div","seed");

      const imgBox = el("div","seedbox");
      const img = document.createElement("img");
      img.src = s.img;
      img.alt = s.title || "seed";
      imgBox.appendChild(img);

      const tx = el("div","seedtext");
      const top = el("div","topline");
      top.appendChild(el("span","label-digital", s.label || "デジタル"));
      top.appendChild(el("div","stitle", s.title || "—"));

      tx.appendChild(top);
      tx.appendChild(el("p","sdesc", s.desc || ""));

      grid.appendChild(imgBox);
      grid.appendChild(tx);
      b.appendChild(grid);
      return b;
    }

    function infoBlock(title, text){
      const b = el("section","block");
      const t = el("div","seedtext");
      const top = el("div","topline");
      top.appendChild(el("span","label-paper","案内"));
      top.appendChild(el("div","stitle", title));
      t.appendChild(top);
      t.appendChild(el("p","sdesc", text));
      b.appendChild(t);
      return b;
    }

    function cardsBlock(cards){
      const b = el("section","block");
      const grid = el("div","cards");
      (cards || []).forEach(c => grid.appendChild(cardTile(c)));
      b.appendChild(grid);
      return b;
    }

          { thumb: FLOW.thumb, title: FLOW.title, period:"", badges:[] },
          () => openModal(FLOW.title, flowModalContent(FLOW))
        )
      );
    }

    render2026();
    render2025();
    renderGuide();
  })();
  </script>
</body>
