<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>神のタネ補填</title>

<style>
body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(180deg,#4b2478,#120620);
  color:#fff8e8;
  font-family:"MS Gothic",sans-serif;
}

.back-btn{
  position:fixed;
  top:16px;
  left:16px;
  padding:10px 16px;
  border-radius:12px;
  background:rgba(0,0,0,.45);
  color:#fff;
  text-decoration:none;
  border:2px solid #ffe8a3;
  font-weight:bold;
  z-index:999;
}

.box{
  width:min(92vw,430px);
  box-sizing:border-box;
  padding:24px;
  border-radius:20px;
  background:rgba(255,255,255,.08);
  border:2px solid rgba(255,223,140,.45);
  text-align:center;
}

.seed-image{
  display:block;
  width:110px;
  max-width:45%;
  height:auto;
  margin:0 auto 10px;
}

h1{
  font-size:22px;
  color:#ffe8a3;
}

button{
  width:100%;
  min-height:54px;
  padding:10px;
  border-radius:16px;
  border:2px solid #ffe8a3;
  background:linear-gradient(180deg,#fff0b8,#dca946);
  color:#2b1c08;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.65;
  cursor:default;
}

.result{
  margin-top:18px;
  line-height:1.8;
  font-size:15px;
  text-align:left;
  overflow-wrap:anywhere;
}

.title-btn{
  display:block;
  width:100%;
  box-sizing:border-box;
  padding:14px;
  border-radius:16px;
  background:linear-gradient(180deg,#bfffa5,#5fae32);
  color:#2b1c08;
  text-decoration:none;
  font-size:18px;
  font-weight:bold;
  border:2px solid #ffe8a3;
  margin-top:20px;
  text-align:center;
}
</style>
</head>

<body>

<a href="javascript:history.back()" class="back-btn">
  ← 戻る
</a>

<div class="box">

  <img
    src="https://takoyaki-card.com/town/assets/images/kaminotane.png"
    alt="神のタネ"
    class="seed-image"
  >

  <h1>🌱 神のタネ受け取り</h1>

  <p>
    先月のランキング記録を確認して、条件達成分の神のタネを受け取れます。
  </p>

  <button id="grantBtn">
    先月分の神のタネを受け取る
  </button>

  <div class="result" id="result"></div>

  <a
    href="https://takoyaki-card.com/town/title.html"
    class="title-btn"
  >
    🌱 神のタネを植えに行く
  </a>

</div>

<script>
(() => {
"use strict";

const GAS_RANKING_API_URL =
  "https://script.google.com/macros/s/AKfycbxZ6s4bgrR4CywdgGiOAk7l9istFjPEK7ph2laKc14NvqGPbNTCQFrFNoqDkgnOK84kJA/exec";

const LS_INV = "tf_v1_inv";
const LS_USER_NAME = "ttc_user_name_v1";
const LS_USER_ID = "ttc_user_id_v1";
const LS_GRANTED = "ttc_god_seed_monthly_granted_v1";

const GOD_RULES = [
  {
    type:"harvest",
    seedId:"seed_god_yaki",
    seedName:"焼き神のタネ",
    label:"🔥 収穫",
    limit:3000
  },
  {
    type:"sales",
    seedId:"seed_god_shop",
    seedName:"露店神のタネ",
    label:"🪙 売上",
    limit:1000000
  },
  {
    type:"fishing",
    seedId:"seed_god_fish",
    seedName:"釣り神のタネ",
    label:"🎣 釣り",
    limit:5000
  },
  {
    type:"tower",
    seedId:"seed_god_tower",
    seedName:"塔神のタネ",
    label:"🗼 タワー",
    limit:50
  }
];

const result = document.getElementById("result");
const grantBtn = document.getElementById("grantBtn");

let isGranting = false;


function getPrevMonthKey(){
  const now = new Date();

  const previousMonth = new Date(
    now.getFullYear(),
    now.getMonth() - 1,
    1
  );

  return (
    previousMonth.getFullYear() +
    "-" +
    String(previousMonth.getMonth() + 1).padStart(2, "0")
  );
}


function loadJson(key, defaultValue){
  try{
    const savedValue = localStorage.getItem(key);

    if(savedValue === null){
      return defaultValue;
    }

    return JSON.parse(savedValue);

  }catch(e){
    return defaultValue;
  }
}


function saveJson(key, value){
  localStorage.setItem(
    key,
    JSON.stringify(value)
  );
}


function getUserId(){
  return String(
    localStorage.getItem(LS_USER_ID) || ""
  ).trim();
}


function getUserName(){
  return String(
    localStorage.getItem(LS_USER_NAME) || ""
  ).trim();
}


function buildUrl(action, params = {}){
  const url = new URL(GAS_RANKING_API_URL);

  url.searchParams.set("action", action);

  Object.entries(params).forEach(([key, value]) => {
    url.searchParams.set(
      key,
      String(value ?? "")
    );
  });

  url.searchParams.set("t", Date.now());

  return url.toString();
}


function loadJsonp(url, timeoutMs = 15000){
  return new Promise((resolve, reject) => {
    const callbackName =
      "__seed_fix_cb_" +
      Date.now() +
      "_" +
      Math.floor(Math.random() * 1000000);

    const separator = url.includes("?") ? "&" : "?";

    let script = null;
    let finished = false;

    const cleanup = () => {
      try{
        delete window[callbackName];
      }catch(e){
        window[callbackName] = undefined;
      }

      if(script && script.parentNode){
        script.parentNode.removeChild(script);
      }
    };

    const timer = setTimeout(() => {
      if(finished){
        return;
      }

      finished = true;
      cleanup();
      reject(new Error("TIMEOUT"));

    }, timeoutMs);

    window[callbackName] = data => {
      if(finished){
        return;
      }

      finished = true;

      clearTimeout(timer);
      cleanup();
      resolve(data);
    };

    script = document.createElement("script");

    script.onerror = () => {
      if(finished){
        return;
      }

      finished = true;

      clearTimeout(timer);
      cleanup();
      reject(new Error("SCRIPT_ERROR"));
    };

    script.src =
      url +
      separator +
      "callback=" +
      encodeURIComponent(callbackName);

    document.head.appendChild(script);
  });
}


async function getMyScore(monthKey, type){
  const userId = getUserId();
  const userName = getUserName();

  const url = buildUrl("getMyScore", {
    monthKey: monthKey,
    type: type,
    userId: userId,
    userName: userName
  });

  const data = await loadJsonp(url);

  if(!data || !data.ok){
    throw new Error(
      data && data.error
        ? data.error
        : "INVALID_RESPONSE"
    );
  }

  return Number(data.score || 0);
}


async function grantSeeds(){
  if(isGranting){
    return;
  }

  const monthKey = getPrevMonthKey();
  const userId = getUserId();
  const userName = getUserName();

  if(!userId && !userName){
    result.innerHTML =
      "利用者情報が見つかりませんでした。<br>" +
      "一度「称号の頂」のページを開いてから、もう一度お試しください。";

    return;
  }

  isGranting = true;
  grantBtn.disabled = true;
  grantBtn.textContent = "先月の記録を確認中…";

  result.innerHTML =
    monthKey +
    " のランキング記録を確認中です...";

  const inv = loadJson(LS_INV, {});
  const granted = loadJson(LS_GRANTED, {});

  if(
    !granted[monthKey] ||
    typeof granted[monthKey] !== "object"
  ){
    granted[monthKey] = {};
  }

  const monthGranted = granted[monthKey];

  const added = [];
  const already = [];
  const failed = [];

  try{
    for(const rule of GOD_RULES){
      const legacyGrantKey =
        monthKey + "_" + rule.seedId;

      if(
        monthGranted[rule.seedId] ||
        granted[legacyGrantKey]
      ){
        already.push(
          rule.label +
          "：" +
          rule.seedName +
          " は受け取り済み"
        );

        continue;
      }

      const score = await getMyScore(
        monthKey,
        rule.type
      );

      if(score >= rule.limit){
        inv[rule.seedId] =
          Number(inv[rule.seedId] || 0) + 1;

        monthGranted[rule.seedId] = {
          receivedAt: Date.now(),
          score: score,
          type: rule.type,
          seedName: rule.seedName
        };

        added.push(
          rule.label +
          "：" +
          score.toLocaleString() +
          " → " +
          rule.seedName +
          " を1個追加"
        );

      }else{
        failed.push(
          rule.label +
          "：" +
          score.toLocaleString() +
          " / 条件 " +
          rule.limit.toLocaleString()
        );
      }
    }

    saveJson(LS_INV, inv);
    saveJson(LS_GRANTED, granted);

    let html =
      "<b>" +
      monthKey +
      " 分の判定結果</b><br><br>";

    if(added.length){
      html += "✅ 受け取り完了<br>";
      html += added.join("<br>");
    }else{
      html +=
        "追加された神のタネはありませんでした。";
    }

    if(already.length){
      html +=
        "<br><br>" +
        "--- 受け取り済み ---<br>" +
        already.join("<br>");
    }

    if(failed.length){
      html +=
        "<br><br>" +
        "--- 条件未達成 ---<br>" +
        failed.join("<br>");
    }

    result.innerHTML = html;

  }catch(e){
    console.error(e);

    result.innerHTML =
      "通信エラーが発生しました。<br>" +
      "ページを再読み込みして、もう一度お試しください。";

  }finally{
    isGranting = false;
    grantBtn.disabled = false;
    grantBtn.textContent =
      "先月分の神のタネを受け取る";
  }
}


grantBtn.addEventListener(
  "click",
  grantSeeds
);

})();
</script>

</body>
</html>
