<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>カードリスト｜第2弾（TN-051〜TN-133）</title>
<meta name="description" content="焼かれた伝説 たこ焼きトレーディングカード 第2弾カードリスト（公式一覧）。TN-051〜TN-133、全83種類。" />

<style>
:root{
  --bg:#0b0d17;
  --panel:rgba(255,255,255,.08);
  --panel2:rgba(255,255,255,.12);
  --line:rgba(255,255,255,.14);
  --text:#fff;
  --muted:rgba(255,255,255,.72);
  --shadow:0 18px 55px rgba(0,0,0,.55);
  --radius:18px;
  --radius2:14px;
  --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono","Courier New", monospace;
  --focus: rgba(160,220,255,.40);
  --glow: 0 10px 35px rgba(80,190,255,.14);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,"Noto Sans JP",sans-serif;
  color:var(--text);
  background:
    radial-gradient(1200px 700px at 50% -10%, rgba(80,190,255,.18), transparent 60%),
    radial-gradient(900px 600px at 10% 20%, rgba(255,170,80,.10), transparent 60%),
    radial-gradient(900px 600px at 90% 40%, rgba(200,120,255,.08), transparent 60%),
    linear-gradient(180deg, #070815 0%, #0b0d17 55%, #070815 100%);
  overflow-x:hidden;
}
body:before{
  content:"";
  position:fixed; inset:0;
  pointer-events:none;
  opacity:.06;
  background-image:
    repeating-linear-gradient(0deg, rgba(255,255,255,.18), rgba(255,255,255,.18) 1px, transparent 1px, transparent 3px);
  mix-blend-mode: overlay;
}

/* ===== Header ===== */
header{
  position: sticky;
  top:0;
  z-index:10;
  padding: calc(14px + env(safe-area-inset-top)) 14px 12px;
  background: linear-gradient(180deg, rgba(7,8,21,.92), rgba(7,8,21,.70));
  border-bottom:1px solid rgba(255,255,255,.10);
  backdrop-filter: blur(10px);
}
.head-inner{
  max-width:1100px;
  margin:0 auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.left{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}
.back{
  border:1px solid rgba(255,255,255,.14);
  background: rgba(255,255,255,.08);
  color: var(--text);
  border-radius: 12px;
  padding: 10px 12px;
  font-weight: 900;
  cursor:pointer;
  -webkit-tap-highlight-color: transparent;
}
.back:active{ transform: translateY(1px); }
.titlebox{
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:2px;
}
.titlebox .title{
  font-size:16px;
  font-weight:1000;
  letter-spacing:.02em;
  line-height:1.2;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.titlebox .sub{
  font-size:12px;
  color:var(--muted);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.right{ display:flex; align-items:center; gap:10px; }
.btn{
  border:1px solid rgba(255,255,255,.14);
  background: rgba(255,255,255,.12);
  color:#fff;
  border-radius:12px;
  padding:10px 12px;
  font-weight:900;
  cursor:pointer;
  -webkit-tap-highlight-color: transparent;
}
.btn:active{ transform: translateY(1px); }

/* ===== Layout ===== */
main{
  max-width:1100px;
  margin:0 auto;
  padding: 14px 14px calc(18px + env(safe-area-inset-bottom));
  display:grid;
  gap:12px;
}
.panel{
  background: var(--panel);
  border:1px solid rgba(255,255,255,.14);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow:hidden;
}
.top-panel{
  padding:12px;
  display:grid;
  gap:10px;
}
.meta-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
}
.pill{
  display:inline-flex;
  align-items:center;
  gap:8px;
  font-weight:1000;
  font-size:12px;
  padding:8px 10px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.14);
  background: rgba(0,0,0,.18);
}
.pill .dot{
  width:8px; height:8px; border-radius:999px;
  background: rgba(160,220,255,.95);
  box-shadow: 0 0 18px rgba(160,220,255,.65);
}
.stat{
  font-family: var(--mono);
  font-size:11px;
  color: rgba(255,255,255,.78);
  border: 1px solid rgba(255,255,255,.14);
  background: rgba(255,255,255,.06);
  padding: 6px 10px;
  border-radius: 999px;
  white-space:nowrap;
}

.controls{
  display:grid;
  grid-template-columns:1fr;
  gap:10px;
}
.search{
  display:flex;
  gap:8px;
  align-items:center;
  background: rgba(0,0,0,.18);
  border: 1px solid rgba(255,255,255,.10);
  border-radius: 14px;
  padding: 10px;
}
.search input{
  width:100%;
  border:none;
  outline:none;
  background:transparent;
  color:#fff;
  font-size:14px;
  font-weight:800;
}
.search input::placeholder{ color: rgba(255,255,255,.55); font-weight:800; }

.chipbar{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}
.chip{
  border:1px solid rgba(255,255,255,.14);
  background: rgba(255,255,255,.08);
  color:#fff;
  border-radius:999px;
  padding:8px 10px;
  font-weight:1000;
  font-size:12px;
  cursor:pointer;
  -webkit-tap-highlight-color: transparent;
  user-select:none;
}
.chip.active{
  border-color: rgba(160,220,255,.35);
  background: linear-gradient(180deg, rgba(160,220,255,.22), rgba(160,220,255,.12));
  box-shadow: var(--glow);
}
.chip:active{ transform: translateY(1px); }

.grid-panel{ padding:12px; }

/* ✅ 1列3枚（スマホでも3枚） */
.grid{
  display:grid;
  grid-template-columns: repeat(3, 1fr);
  gap:10px;
}

/* 画面が狭すぎる端末だけ2枚に戻す（任意：超小型用） */
@media (max-width:360px){
  .grid{ grid-template-columns: repeat(2, 1fr); }
}

/* タブレット以上はそのまま増やしてOK */
@media (min-width:560px){ .grid{ grid-template-columns: repeat(4, 1fr); } }
@media (min-width:900px){ .grid{ grid-template-columns: repeat(5, 1fr); } }

.card{
  border:1px solid rgba(255,255,255,.14);
  background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.06));
  border-radius:16px;
  overflow:hidden;
  cursor:pointer;
  -webkit-tap-highlight-color: transparent;
  box-shadow: 0 14px 40px rgba(0,0,0,.28);
  display:grid;
  grid-template-rows:auto 1fr;
  min-height:200px;
  transition: transform .10s ease, border-color .10s ease;
  position:relative;
}
.card:hover{ border-color: rgba(160,220,255,.30); }
.card:active{ transform: scale(.995); }

.thumb{
  position:relative;
  width:100%;
  aspect-ratio: 3/4;
  background: rgba(0,0,0,.22);
  overflow:hidden;
}
.thumb img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
}

.ribbon{
  position:absolute;
  top:10px;
  left:10px;
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:6px 8px;
  border-radius:999px;
  font-weight:1000;
  font-size:11px;
  color:#fff;
  background: rgba(0,0,0,.55);
  border:1px solid rgba(255,255,255,.16);
  backdrop-filter: blur(6px);
}
.ribbon .dot{
  width:8px; height:8px; border-radius:999px;
  background: rgba(160,220,255,.95);
  box-shadow: 0 0 18px rgba(160,220,255,.6);
}
.ribbon.shop .dot{ background: rgba(255,210,120,.95); box-shadow: 0 0 18px rgba(255,210,120,.55); }
.ribbon.booth .dot{ background: rgba(160,255,200,.95); box-shadow: 0 0 18px rgba(160,255,200,.55); }

.info{
  padding:10px 10px 12px;
  display:grid;
  gap:6px;
}
.no{
  font-family: var(--mono);
  font-size:11px;
  color: rgba(255,255,255,.78);
  letter-spacing:.02em;
}
.name{
  font-size:11.5px;
  font-weight:1000;
  line-height:1.28;
  letter-spacing:.01em;
}

.empty{
  padding:14px;
  color: var(--muted);
  font-weight:900;
  text-align:center;
  border: 1px dashed rgba(255,255,255,.22);
  border-radius: 16px;
  background: rgba(0,0,0,.12);
  display:none;
}

/* ===== Modal ===== */
.modal-bg{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  padding:16px;
  z-index:100;
  background: rgba(0,0,0,.62);
  backdrop-filter: blur(8px);
  overflow-y:auto;
  overscroll-behavior:contain;
}
.modal-bg.open{ display:flex; }

.modal{
  width:min(560px, 100%);
  max-height:calc(100dvh - 32px);
  overflow-y:auto;
  overscroll-behavior:contain;
  border-radius:18px;
  border: 1px solid rgba(255,255,255,.16);
  background:
    radial-gradient(900px 400px at 50% 0%, rgba(80,190,255,.14), transparent 62%),
    linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.06));
  box-shadow: 0 22px 80px rgba(0,0,0,.65);
  overflow:hidden;
  transform: translateY(10px) scale(.985);
  opacity:0;
  transition: transform .14s ease, opacity .14s ease;
}
.modal-bg.open .modal{ transform: translateY(0) scale(1); opacity:1; }

.modal-head{
  padding:14px 14px 10px;
  border-bottom: 1px solid rgba(255,255,255,.12);
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
}
.modal-title{
  display:flex;
  flex-direction:column;
  gap:4px;
  min-width:0;
}
.modal-title .h{
  font-size:16px;
  font-weight:1000;
  letter-spacing:.02em;
  line-height:1.2;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.modal-title .p{
  font-size:12px;
  color: var(--muted);
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  align-items:center;
}
.tag{
  font-family: var(--mono);
  font-size:11px;
  color: rgba(255,255,255,.78);
  border: 1px solid rgba(255,255,255,.14);
  background: rgba(255,255,255,.06);
  padding: 4px 8px;
  border-radius: 999px;
  white-space: nowrap;
}
.xbtn{
  border:1px solid rgba(255,255,255,.16);
  background: rgba(0,0,0,.18);
  color:#fff;
  border-radius:12px;
  width:42px;
  height:42px;
  font-size:18px;
  font-weight:1000;
  cursor:pointer;
  -webkit-tap-highlight-color: transparent;
}
.xbtn:active{ transform: translateY(1px); }

.modal-body{
  padding:14px;
  display:grid;
  gap:12px;
}
.bigimg{
  width:100%;
  max-height:min(68dvh, 700px);
  border-radius:16px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.12);
  background: rgba(0,0,0,.20);
  display:flex;
  align-items:center;
  justify-content:center;
}
.bigimg img{
  width:100%;
  height:auto;
  max-height:min(68dvh, 700px);
  object-fit:contain;
  display:block;
  margin:0 auto;
}
.actions{
  display:grid;
  gap:10px;
}
.primary{
  border:1px solid rgba(160,220,255,.35);
  background: linear-gradient(180deg, rgba(160,220,255,.22), rgba(160,220,255,.12));
  box-shadow: var(--glow);
  border-radius:14px;
  padding:14px 12px;
  font-weight:1000;
  color:#fff;
  cursor:pointer;
  -webkit-tap-highlight-color: transparent;
  text-align:center;
  text-decoration:none;
}
.ghost{
  border:1px solid rgba(255,255,255,.16);
  background: rgba(255,255,255,.08);
  border-radius:14px;
  padding:12px 10px;
  font-weight:1000;
  color:#fff;
  cursor:pointer;
  -webkit-tap-highlight-color: transparent;
  text-align:center;
}
.primary:active,.ghost:active{ transform: translateY(1px); }

.toast{
  position: fixed;
  left: 12px;
  right: 12px;
  bottom: calc(14px + env(safe-area-inset-bottom));
  z-index: 200;
  pointer-events:none;
  opacity:0;
  transform: translateY(10px) scale(.98);
  transition: opacity .16s ease, transform .18s ease;
  padding: 12px 12px;
  border-radius: 14px;
  border: 1px solid rgba(255,255,255,.14);
  background: rgba(0,0,0,.72);
  color: #fff;
  font-weight: 900;
  letter-spacing:.02em;
  text-align:center;
  box-shadow: 0 16px 60px rgba(0,0,0,.55);
}
.toast.show{ opacity:1; transform: translateY(0) scale(1); }

button:focus-visible, input:focus-visible{
  outline: 3px solid var(--focus);
  outline-offset: 2px;
}
</style>
</head>

<body>
<header>
  <div class="head-inner">
    <div class="left">
      <button id="backBtn" class="back" type="button" aria-label="戻る">←</button>
      <div class="titlebox">
        <div class="title">カードリスト：第2弾</div>
        <div class="sub">TN-051〜TN-133 / 全83種類（公式一覧）</div>
      </div>
    </div>
    <div class="right">
      <button id="helpBtn" class="btn" type="button" aria-label="ヘルプ">？</button>
    </div>
  </div>
</header>

<main>
  <section class="panel top-panel">
    <div class="meta-row">
      <div class="pill"><span class="dot"></span> 第2弾（公式カードリスト）</div>
      <div id="statLine" class="stat">loading...</div>
    </div>

    <div class="controls">
      <div class="search">
        <input id="q" type="search" placeholder="検索：カード名 / TN-番号（例：TN-025）" autocomplete="off" />
      </div>

      <div class="chipbar" aria-label="フィルタ">
        <button class="chip active" data-rarity="ALL" type="button">全て</button>
        <button class="chip" data-rarity="N" type="button">N</button>
        <button class="chip" data-rarity="R" type="button">R</button>
        <button class="chip" data-rarity="SR" type="button">SR</button>
        <button class="chip" data-rarity="UR" type="button">UR</button>
        <button class="chip" data-rarity="LR" type="button">LR</button>
        <button class="chip" data-rarity="SA" type="button">SA</button>

        <span style="width:10px;display:inline-block;"></span>

        <button class="chip active" data-place="ALL" type="button">全83種類</button>
        <button class="chip" data-place="TAKOMIN" type="button">タコ民 TN-052〜069</button>
      </div>
    </div>
  </section>

  <section class="panel grid-panel">
    <div id="grid" class="grid" aria-label="カード一覧"></div>
    <div id="empty" class="empty">該当カードが見つからない…（検索条件を変えてみて）</div>
  </section>
</main>

<!-- 詳細モーダル -->
<div id="modalBg" class="modal-bg" role="presentation" aria-hidden="true">
  <div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="modal-head">
      <div class="modal-title">
        <div id="mTitle" class="h">-</div>
        <div class="p">
          <span id="mNo" class="tag">-</span>
          <span id="mRarity" class="tag">-</span>
          <span id="mPlace" class="tag">-</span>
        </div>
      </div>
      <button id="mCloseX" class="xbtn" type="button" aria-label="閉じる">×</button>
    </div>

    <div class="modal-body">
      <div class="bigimg"><img id="mImg" alt="カード画像" /></div>
      <div class="actions">
        <a id="openImg" class="primary" href="#" target="_blank" rel="noopener">画像を別タブで開く</a>
        <button id="mClose" class="ghost" type="button">閉じる</button>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast" aria-live="polite" aria-atomic="true"></div>

<script>
(() => {
  "use strict";

  // =========================
  // 設定
  // =========================
  const CONFIG = {
    // ここをあなたの導線に合わせて変えてOK
    BACK_URL: "./index.html", // 例：街マップに戻る
  };

  // 第2弾データは同じフォルダの cards-vol2.json から取得します。
  const DATA_URL = "./cards-vol2.json";
  let ALL = [];
  const RARITY_ORDER = ["N","R","SR","UR","LR","SA"];
  function parseNum(no){ const m = String(no).match(/(\d{1,4})/); return m ? Number(m[1]) : NaN; }
  function placeOf(no){ const n = parseNum(no); return n >= 52 && n <= 69 ? "TAKOMIN" : "OTHER"; }
  function placeLabel(place){ return place === "TAKOMIN" ? "タコ民" : "第2弾"; }
  function normalize(s){ return String(s || "").toLowerCase().replace(/\s+/g,"").replace(/　+/g,""); }
  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
  function imgForList(card){ return card.img; }

  // =========================
  // DOM
  // =========================
  const $ = (q) => document.querySelector(q);
  const $$ = (q) => Array.from(document.querySelectorAll(q));

  const backBtn = $("#backBtn");
  const helpBtn = $("#helpBtn");
  const statLine = $("#statLine");
  const qInput = $("#q");
  const grid = $("#grid");
  const empty = $("#empty");

  const modalBg = $("#modalBg");
  const mCloseX = $("#mCloseX");
  const mClose = $("#mClose");
  const mTitle = $("#mTitle");
  const mNo = $("#mNo");
  const mRarity = $("#mRarity");
  const mPlace = $("#mPlace");
  const mImg = $("#mImg");
  const openImg = $("#openImg");

  const toastEl = $("#toast");

  // =========================
  // toast
  // =========================
  let toastTimer = null;
  function toast(msg){
    clearTimeout(toastTimer);
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1400);
  }

  // =========================
  // State
  // =========================
  const state = {
    rarity: "ALL",
    place: "ALL",
    q: "",
  };

  // =========================
  // Chips
  // =========================
  const rarityChips = $$(".chip[data-rarity]");
  const placeChips  = $$(".chip[data-place]");

  function setActiveChip(list, predicate){
    for (const el of list){
      el.classList.toggle("active", predicate(el));
    }
  }

  rarityChips.forEach(el => {
    el.addEventListener("click", () => {
      state.rarity = el.dataset.rarity;
      setActiveChip(rarityChips, x => x.dataset.rarity === state.rarity);
      render();
    });
  });

  placeChips.forEach(el => {
    el.addEventListener("click", () => {
      state.place = el.dataset.place;
      setActiveChip(placeChips, x => x.dataset.place === state.place);
      render();
    });
  });

  qInput.addEventListener("input", () => {
    state.q = qInput.value || "";
    render();
  });

  // =========================
  // Modal
  // =========================
  let lastFocus = null;

  function openModal(card){
    lastFocus = document.activeElement;

    mTitle.textContent = card.name;
    mNo.textContent = card.no;
    mRarity.textContent = `RARITY:${card.rarity}`;
    mPlace.textContent = placeLabel(card.place);

    // ✅ モーダルも「このページ用の画像」で開く
    const src = imgForList(card);
    mImg.src = src;
    mImg.alt = `${card.name}（${card.no}）`;
    openImg.href = src;

    modalBg.classList.add("open");
    modalBg.setAttribute("aria-hidden","false");
    setTimeout(() => mCloseX.focus({preventScroll:true}), 10);
  }

  function closeModal(){
    modalBg.classList.remove("open");
    modalBg.setAttribute("aria-hidden","true");
    if (lastFocus && typeof lastFocus.focus === "function"){
      setTimeout(() => lastFocus.focus({preventScroll:true}), 10);
    }
  }

  modalBg.addEventListener("click", (e) => {
    if (e.target === modalBg) closeModal();
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && modalBg.classList.contains("open")){
      e.preventDefault();
      closeModal();
    }
  });

  mCloseX.addEventListener("click", closeModal);
  mClose.addEventListener("click", closeModal);

  // =========================
  // Render
  // =========================
  function filtered(){
    const nq = normalize(state.q);

    return ALL.filter(c => {
      if (state.rarity !== "ALL" && c.rarity !== state.rarity) return false;
      if (state.place !== "ALL" && c.place !== state.place) return false;

      if (nq){
        const hay = normalize(`${c.no} ${c.name} ${c.rarity} ${placeLabel(c.place)}`);
        if (!hay.includes(nq)) return false;
      }
      return true;
    });
  }

  function render(){
    const list = filtered();
    const total = ALL.length;
    const shown = list.length;

    statLine.textContent = `表示:${shown}/${total}（公式）`;

    grid.innerHTML = "";
    empty.style.display = (shown === 0) ? "block" : "none";

    for (const c of list){
      const place = c.place;
      const ribbonClass = place === "TAKOMIN" ? "ribbon shop" : "ribbon booth";
      const ribbonText = placeLabel(place);

      const card = document.createElement("div");
      card.className = "card";
      card.setAttribute("role","button");
      card.setAttribute("tabindex","0");
      card.setAttribute("aria-label", `${c.no} ${c.name} を開く`);

      // ✅ 一覧も「このページ用の画像」で表示
      const src = imgForList(c);

      card.innerHTML = `
        <div class="thumb">
          <img loading="lazy" decoding="async" src="${src}" alt="${escapeHtml(c.name)}">
          <div class="${ribbonClass}"><span class="dot"></span>${ribbonText}</div>
        </div>
        <div class="info">
          <div class="no">${c.no} / ${c.rarity}</div>
          <div class="name">${escapeHtml(c.name)}</div>
        </div>
      `;

      const open = () => openModal(c);
      card.addEventListener("click", open);
      card.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " "){
          e.preventDefault();
          open();
        }
      });

      grid.appendChild(card);
    }
  }

  // =========================
  // Header buttons
  // =========================
  backBtn.addEventListener("click", () => location.href = CONFIG.BACK_URL);
  helpBtn.addEventListener("click", () => toast("検索・レアリティ・カード番号で絞り込み → タップで拡大"));

  // 初回表示：JSONを読み込んでから描画
  async function loadCards(){
    try {
      const res = await fetch(DATA_URL, {cache:"no-store"});
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const payload = await res.json();
      if (!payload || !Array.isArray(payload.cards)) throw new Error("cards配列がありません");
      ALL = payload.cards.map(c => ({
        no: String(c.id || c.no || ""), name: String(c.name || ""),
        rarity: String(c.rarity || "N").toUpperCase(), img: String(c.img || ""),
        num: parseNum(c.id || c.no), place: placeOf(c.id || c.no)
      })).filter(c => c.num >= 51 && c.num <= 133)
        .sort((a,b) => a.num - b.num);
      if (ALL.length !== 83) throw new Error(`83種類ではありません（${ALL.length}種類）`);
      render();
    } catch(err) {
      console.error("第2弾カードデータの読込失敗", err);
      statLine.textContent = "読込エラー";
      empty.style.display = "block";
      empty.textContent = "cards-vol2.json を読み込めませんでした。HTMLと同じフォルダに置いてください。";
    }
  }
  loadCards();

  // 画像ロード失敗（一覧だけ薄く）
  grid.addEventListener("error", (e) => {
    const t = e.target;
    if (t && t.tagName === "IMG") t.style.opacity = "0.35";
  }, true);

})();
</script>
</body>
</html>
